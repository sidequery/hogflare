models:
  - name: attribution
    sql: |
      with latest_profiles as (
        select *
        from (
          select
            *,
            row_number() over (partition by person_id order by updated_at desc, version desc, created_at desc) as profile_rank
          from {{ persons_table }}
          where person_id is not null
        )
        where profile_rank = 1
      ),
      identity_map as (
        select
          resolved_person_id,
          canonical_distinct_id,
          linked_distinct_id
        from (
          select
            person_id as resolved_person_id,
            canonical_distinct_id,
            distinct_id as linked_distinct_id,
            row_number() over (partition by distinct_id order by updated_at desc, version desc, created_at desc) as identity_rank
          from latest_profiles,
          unnest(distinct_ids) as identity_distinct_ids(distinct_id)
          where distinct_id is not null
        )
        where identity_rank = 1
      ),
      event_base as (
        select
          uuid,
          event as event_type,
          distinct_id as actor_id,
          person_id,
          coalesce(person_id, identity_map.resolved_person_id) as resolved_person_id,
          identity_map.canonical_distinct_id,
          coalesce(timestamp, created_at) as event_time,
          api_key,
          coalesce(
            json_extract_string(properties, '$.$current_url'),
            json_extract_string(properties, '$.current_url'),
            json_extract_string(properties, '$.url')
          ) as current_url,
          coalesce(
            json_extract_string(properties, '$.$referrer'),
            json_extract_string(properties, '$.referrer')
          ) as referrer,
          coalesce(
            json_extract_string(properties, '$.$initial_referrer'),
            json_extract_string(properties, '$.initial_referrer')
          ) as initial_referrer,
          coalesce(
            json_extract_string(properties, '$.$utm_source'),
            json_extract_string(properties, '$.utm_source')
          ) as utm_source,
          coalesce(
            json_extract_string(properties, '$.$utm_medium'),
            json_extract_string(properties, '$.utm_medium')
          ) as utm_medium,
          coalesce(
            json_extract_string(properties, '$.$utm_campaign'),
            json_extract_string(properties, '$.utm_campaign')
          ) as utm_campaign,
          coalesce(
            json_extract_string(properties, '$.$utm_content'),
            json_extract_string(properties, '$.utm_content')
          ) as utm_content,
          coalesce(
            json_extract_string(properties, '$.$utm_term'),
            json_extract_string(properties, '$.utm_term')
          ) as utm_term,
          coalesce(
            json_extract_string(properties, '$.$initial_utm_source'),
            json_extract_string(properties, '$.initial_utm_source')
          ) as initial_utm_source,
          coalesce(
            json_extract_string(properties, '$.$initial_utm_medium'),
            json_extract_string(properties, '$.initial_utm_medium')
          ) as initial_utm_medium,
          coalesce(
            json_extract_string(properties, '$.$initial_utm_campaign'),
            json_extract_string(properties, '$.initial_utm_campaign')
          ) as initial_utm_campaign,
          coalesce(
            json_extract_string(properties, '$.$initial_utm_content'),
            json_extract_string(properties, '$.initial_utm_content')
          ) as initial_utm_content,
          coalesce(
            json_extract_string(properties, '$.$initial_utm_term'),
            json_extract_string(properties, '$.initial_utm_term')
          ) as initial_utm_term
        from {{ events_table }}
        left join identity_map on distinct_id = identity_map.linked_distinct_id
        where coalesce(timestamp, created_at) is not null
      ),
      touches as (
        select
          *,
          coalesce(utm_source, initial_utm_source) as touch_utm_source,
          coalesce(utm_medium, initial_utm_medium) as touch_utm_medium,
          coalesce(utm_campaign, initial_utm_campaign) as touch_utm_campaign,
          coalesce(utm_content, initial_utm_content) as touch_utm_content,
          coalesce(utm_term, initial_utm_term) as touch_utm_term,
          coalesce(referrer, initial_referrer) as touch_referrer,
          (
            utm_source is not null
            or utm_medium is not null
            or utm_campaign is not null
            or utm_content is not null
            or utm_term is not null
            or initial_utm_source is not null
            or initial_utm_medium is not null
            or initial_utm_campaign is not null
            or initial_utm_content is not null
            or initial_utm_term is not null
            or referrer is not null
            or initial_referrer is not null
          ) as has_attribution
        from event_base
      )
      select
        actor_id as attribution_id,
        actor_id,
        max(resolved_person_id) as person_id,
        max(canonical_distinct_id) as canonical_distinct_id,
        first(api_key order by event_time asc) as api_key,
        min(event_time) as first_seen_at,
        max(event_time) as last_seen_at,
        min(event_time) filter (where has_attribution) as first_touch_at,
        max(event_time) filter (where has_attribution) as last_touch_at,
        arg_min(current_url, event_time) filter (where current_url is not null) as first_url,
        arg_max(current_url, event_time) filter (where current_url is not null) as last_url,
        arg_min(touch_referrer, event_time) filter (where touch_referrer is not null) as first_referrer,
        arg_max(touch_referrer, event_time) filter (where touch_referrer is not null) as last_referrer,
        arg_min(touch_utm_source, event_time) filter (where touch_utm_source is not null) as first_utm_source,
        arg_max(touch_utm_source, event_time) filter (where touch_utm_source is not null) as last_utm_source,
        arg_min(touch_utm_medium, event_time) filter (where touch_utm_medium is not null) as first_utm_medium,
        arg_max(touch_utm_medium, event_time) filter (where touch_utm_medium is not null) as last_utm_medium,
        arg_min(touch_utm_campaign, event_time) filter (where touch_utm_campaign is not null) as first_utm_campaign,
        arg_max(touch_utm_campaign, event_time) filter (where touch_utm_campaign is not null) as last_utm_campaign,
        arg_min(touch_utm_content, event_time) filter (where touch_utm_content is not null) as first_utm_content,
        arg_max(touch_utm_content, event_time) filter (where touch_utm_content is not null) as last_utm_content,
        arg_min(touch_utm_term, event_time) filter (where touch_utm_term is not null) as first_utm_term,
        arg_max(touch_utm_term, event_time) filter (where touch_utm_term is not null) as last_utm_term,
        max(has_attribution) as has_attribution,
        max(touch_utm_source is not null or touch_utm_medium is not null or touch_utm_campaign is not null or touch_utm_content is not null or touch_utm_term is not null) as has_utm,
        max(touch_referrer is not null) as has_referrer,
        max(current_url is not null) as has_current_url,
        count(*) as event_count,
        count(*) filter (where has_attribution) as attribution_event_count
      from touches
      group by actor_id
    description: First-touch and last-touch attribution by actor using PostHog UTM, initial UTM, referrer, and current URL properties.
    primary_key: attribution_id
    default_time_dimension: first_seen_at
    default_grain: day

    relationships:
      - name: persons
        type: many_to_one
        foreign_key: actor_id
        primary_key: actor_id
      - name: person_profiles
        type: many_to_one
        foreign_key: person_id
        primary_key: person_id

    dimensions:
      - name: attribution_id
        type: categorical
      - name: actor_id
        type: categorical
      - name: person_id
        type: categorical
      - name: canonical_distinct_id
        type: categorical
      - name: api_key
        type: categorical
      - name: first_url
        type: categorical
      - name: last_url
        type: categorical
      - name: first_referrer
        type: categorical
      - name: last_referrer
        type: categorical
      - name: first_utm_source
        type: categorical
      - name: last_utm_source
        type: categorical
      - name: first_utm_medium
        type: categorical
      - name: last_utm_medium
        type: categorical
      - name: first_utm_campaign
        type: categorical
      - name: last_utm_campaign
        type: categorical
      - name: first_utm_content
        type: categorical
      - name: last_utm_content
        type: categorical
      - name: first_utm_term
        type: categorical
      - name: last_utm_term
        type: categorical
      - name: has_attribution
        type: boolean
      - name: has_utm
        type: boolean
      - name: has_referrer
        type: boolean
      - name: has_current_url
        type: boolean
      - name: event_count
        type: numeric
      - name: attribution_event_count
        type: numeric
      - name: first_seen_at
        type: time
        granularity: day
      - name: last_seen_at
        type: time
        granularity: day
      - name: first_touch_at
        type: time
        granularity: day
      - name: last_touch_at
        type: time
        granularity: day

    metrics:
      - name: actor_count
        agg: count
        description: Actors included in attribution rollups.
      - name: attributed_actors
        agg: count
        filters:
          - has_attribution
        description: Actors with at least one UTM, initial UTM, or referrer touch.
      - name: actors_with_utm
        agg: count
        filters:
          - has_utm
        description: Actors with UTM or initial UTM properties.
      - name: actors_with_referrer
        agg: count
        filters:
          - has_referrer
        description: Actors with referrer or initial referrer properties.
      - name: actors_with_current_url
        agg: count
        filters:
          - has_current_url
        description: Actors with at least one current URL.
      - name: attribution_events
        agg: sum
        sql: attribution_event_count
        description: Events carrying UTM, initial UTM, or referrer attribution signals.

