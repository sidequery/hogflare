models:
  - name: persons
    sql: |
      with latest_profiles as (
        select *
        from (
          select
            *,
            row_number() over (partition by person_id order by updated_at desc, version desc, created_at desc) as profile_rank
          from {{ persons_table }}
          where person_id is not null
        )
        where profile_rank = 1
      ),
      identity_map as (
        select
          resolved_person_id,
          canonical_distinct_id,
          linked_distinct_id
        from (
          select
            person_id as resolved_person_id,
            canonical_distinct_id,
            distinct_id as linked_distinct_id,
            row_number() over (partition by distinct_id order by updated_at desc, version desc, created_at desc) as identity_rank
          from latest_profiles,
          unnest(distinct_ids) as identity_distinct_ids(distinct_id)
          where distinct_id is not null
        )
        where identity_rank = 1
      ),
      event_base as (
        select
          distinct_id as actor_id,
          person_id,
          coalesce(person_id, identity_map.resolved_person_id) as resolved_person_id,
          identity_map.canonical_distinct_id,
          event as event_type,
          coalesce(timestamp, created_at) as event_time,
          person_created_at,
          person_properties,
          properties,
          coalesce(json_extract_string(properties, '$.$session_id'), json_extract_string(properties, '$.session_id')) as session_id,
          coalesce(json_extract_string(properties, '$.plan'), json_extract_string(person_properties, '$.plan')) as plan,
          coalesce(json_extract_string(properties, '$.email'), json_extract_string(person_properties, '$.email')) as email,
          coalesce(json_extract_string(properties, '$.$browser'), json_extract_string(properties, '$.browser')) as browser,
          coalesce(json_extract_string(properties, '$.$os'), json_extract_string(properties, '$.os')) as os,
          coalesce(json_extract_string(properties, '$.$geoip_country_code'), json_extract_string(properties, '$.country')) as geo_country_code
        from {{ events_table }}
        left join identity_map on distinct_id = identity_map.linked_distinct_id
      )
      select
        actor_id,
        max(resolved_person_id) as person_id,
        max(canonical_distinct_id) as canonical_distinct_id,
        min(coalesce(person_created_at, event_time)) as first_seen_at,
        max(event_time) as last_seen_at,
        first(event_type order by event_time asc) as first_event_type,
        last(event_type order by event_time asc) as last_event_type,
        last(plan order by event_time asc) as plan,
        nullif(regexp_extract(last(email order by event_time asc), '@([^@]+)$', 1), '') as email_domain,
        last(browser order by event_time asc) as browser,
        last(os order by event_time asc) as os,
        last(geo_country_code order by event_time asc) as geo_country_code,
        count(*) as event_count,
        count(distinct coalesce(session_id, actor_id || ':' || strftime(event_time, '%Y-%m-%d'))) as session_count
      from event_base
      group by actor_id
    description: Person/actor rollup derived from the event stream.
    primary_key: actor_id
    default_time_dimension: first_seen_at
    default_grain: day

    relationships:
      - name: person_profiles
        type: many_to_one
        foreign_key: person_id
        primary_key: person_id

    dimensions:
      - name: actor_id
        type: categorical
      - name: person_id
        type: categorical
      - name: canonical_distinct_id
        type: categorical
      - name: first_event_type
        type: categorical
      - name: last_event_type
        type: categorical
      - name: plan
        type: categorical
      - name: email_domain
        type: categorical
      - name: browser
        type: categorical
      - name: os
        type: categorical
      - name: geo_country_code
        type: categorical
      - name: event_count
        type: numeric
      - name: session_count
        type: numeric
      - name: first_seen_at
        type: time
        granularity: day
      - name: last_seen_at
        type: time
        granularity: day

    metrics:
      - name: person_count
        agg: count
        description: Count of actors/persons.
      - name: identified_persons
        agg: count
        filters:
          - person_id is not null
        description: Actors with a resolved Hogflare person id.
      - name: total_events
        agg: sum
        sql: event_count
        description: Total events across actors.
      - name: total_sessions
        agg: sum
        sql: session_count
        description: Total sessions across actors.
      - name: average_events_per_person
        agg: avg
        sql: event_count
        description: Average events per actor.
      - name: average_sessions_per_person
        agg: avg
        sql: session_count
        description: Average sessions per actor.

