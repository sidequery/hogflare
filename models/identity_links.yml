models:
  - name: identity_links
    sql: |
      with latest_profiles as (
        select *
        from (
          select
            *,
            row_number() over (partition by person_id order by updated_at desc, version desc, created_at desc) as profile_rank
          from {{ persons_table }}
          where person_id is not null
        )
        where profile_rank = 1
      ),
      exploded_links as (
        select
          *,
          row_number() over (partition by distinct_id order by updated_at desc, version desc, created_at desc) as identity_rank
        from latest_profiles,
        unnest(distinct_ids) as identity_distinct_ids(distinct_id)
        where distinct_id is not null
      )
      select
        person_id || ':' || distinct_id as identity_link_id,
        person_id,
        person_int_id,
        canonical_distinct_id,
        distinct_id,
        distinct_id as actor_id,
        distinct_id = canonical_distinct_id as is_canonical,
        array_length(distinct_ids) as person_distinct_id_count,
        source,
        operation,
        team_id,
        api_key,
        source_event_uuid,
        created_at,
        updated_at,
        version,
        properties,
        properties_set_once,
        merged_properties
      from exploded_links
      where identity_rank = 1
    description: One row per PostHog distinct id linked to a Hogflare person profile.
    primary_key: identity_link_id
    default_time_dimension: updated_at
    default_grain: day

    relationships:
      - name: person_profiles
        type: many_to_one
        foreign_key: person_id
        primary_key: person_id
      - name: persons
        type: many_to_one
        foreign_key: distinct_id
        primary_key: actor_id

    dimensions:
      - name: identity_link_id
        type: categorical
      - name: person_id
        type: categorical
      - name: person_int_id
        type: numeric
      - name: canonical_distinct_id
        type: categorical
      - name: distinct_id
        type: categorical
      - name: actor_id
        type: categorical
      - name: is_canonical
        type: boolean
      - name: person_distinct_id_count
        type: numeric
      - name: source
        type: categorical
      - name: operation
        type: categorical
      - name: team_id
        type: numeric
      - name: api_key
        type: categorical
      - name: source_event_uuid
        type: categorical
      - name: version
        type: numeric
      - name: created_at
        type: time
        granularity: day
      - name: updated_at
        type: time
        granularity: day

    metrics:
      - name: identity_link_count
        agg: count
        description: Distinct-id links across person profiles.
      - name: resolved_persons
        agg: count_distinct
        sql: person_id
        description: Person profiles with at least one distinct-id link.
      - name: linked_actors
        agg: count_distinct
        sql: distinct_id
        description: Distinct PostHog actor ids present in the person identity bridge.
      - name: canonical_links
        agg: count
        filters:
          - is_canonical
        description: Links where the distinct id is the profile canonical distinct id.
      - name: noncanonical_links
        agg: count
        filters:
          - not is_canonical
        description: Alias or secondary distinct-id links.

