<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hogflare Replay Explorer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/index.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f8;
        --surface: #ffffff;
        --surface-soft: #eef1f4;
        --ink: #0b0d10;
        --muted: #5c6670;
        --faint: #7b8490;
        --line: #dbe1e7;
        --line-strong: #b9c2cc;
        --accent: #087a55;
        --accent-soft: #e3f4eb;
        --danger: #9d332b;
        --mono:
          "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
      }

      body {
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1.35;
        text-rendering: geometricPrecision;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .app {
        display: grid;
        --rail-track: minmax(320px, 380px);
        --inspector-track: minmax(330px, 420px);
        grid-template-columns: var(--rail-track) minmax(560px, 1fr) var(--inspector-track);
        height: 100vh;
        min-height: 0;
      }

      .app.rail-collapsed {
        --rail-track: 0px;
      }

      .app.inspector-collapsed {
        --inspector-track: 0px;
      }

      .rail,
      .stage,
      .inspector {
        min-height: 0;
        background: var(--surface);
      }

      .rail {
        position: relative;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        border-right: 1px solid var(--line);
      }

      .rail-content {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 0;
      }

      .stage {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        border-right: 1px solid var(--line);
      }

      .app.inspector-collapsed .stage {
        border-right: 0;
      }

      .inspector {
        position: relative;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
      }

      .inspector-content {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        min-height: 0;
      }

      .app.rail-collapsed .rail-content,
      .app.inspector-collapsed .inspector-content {
        display: none;
      }

      .app.rail-collapsed .rail,
      .app.inspector-collapsed .inspector {
        border: 0;
        background: transparent;
        pointer-events: none;
        z-index: 20;
      }

      .topbar,
      .stage-head,
      .inspector-head {
        height: 56px;
        border-bottom: 1px solid var(--line);
        padding: 8px 16px;
      }

      .inspector-head {
        display: flex;
        align-items: center;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 40px;
        color: var(--ink);
      }

      .brand-mark svg {
        display: block;
        width: 34px;
        height: 40px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 15px;
        font-weight: 720;
        letter-spacing: 0;
      }

      h2 {
        font-size: 14px;
        font-weight: 720;
      }

      .eyebrow,
      .label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 680;
        letter-spacing: 0;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .status::before {
        display: block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--line-strong);
        content: "";
      }

      .status.is-ok::before {
        background: var(--accent);
      }

      .status[hidden] {
        display: none !important;
      }

      .mode-switch {
        display: flex;
        gap: 5px;
        overflow-x: auto;
        background: transparent;
      }

      .mode-button {
        height: 28px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--muted);
        padding: 0 9px;
        font-size: 11px;
        font-weight: 680;
        white-space: nowrap;
      }

      .mode-button[aria-selected="true"] {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--surface);
      }

      .filters {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        padding: 12px;
      }

      .rail-body {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        min-height: 0;
      }

      .result-controls {
        display: grid;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
      }

      .mode-options {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .mode-panel {
        display: grid;
        gap: 8px;
      }

      .select-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }

      .select-field {
        display: grid;
        min-width: 0;
        gap: 5px;
      }

      .select-field select {
        width: 100%;
        height: 32px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--ink);
        padding: 0 8px;
        outline: none;
        font-size: 12px;
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip-button {
        height: 28px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--muted);
        padding: 0 9px;
        font-size: 11px;
        font-weight: 680;
      }

      .chip-button.is-selected {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--ink);
      }

      .date-range {
        display: grid;
        grid-column: 1 / -1;
        min-inline-size: 0;
        min-width: 0;
        gap: 8px;
        margin: 0;
        padding: 0;
      }

      .date-range-label {
        display: block;
      }

      .date-inputs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .date-field {
        display: grid;
        min-width: 0;
        gap: 5px;
      }

      .date-field span {
        color: var(--muted);
        font-size: 11px;
        font-weight: 680;
      }

      .date-presets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .preset-button {
        height: 26px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--muted);
        padding: 0 8px;
        font-size: 11px;
        font-weight: 680;
      }

      .field {
        display: grid;
        min-width: 0;
        gap: 5px;
      }

      .field.wide {
        grid-column: 1 / -1;
      }

      .field input,
      .date-field input {
        width: 100%;
        height: 34px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--ink);
        padding: 0 9px;
        outline: none;
        font-size: 12px;
      }

      .date-field input {
        padding-right: 6px;
      }

      .date-field input::-webkit-calendar-picker-indicator {
        cursor: pointer;
        opacity: 0.7;
      }

      .field input:focus,
      .date-field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }

      .actions {
        display: flex;
        grid-column: 1 / -1;
        gap: 8px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        height: 34px;
        border-radius: 5px;
        padding: 0 11px;
        background: var(--ink);
        color: var(--surface);
        font-size: 12px;
        font-weight: 720;
        white-space: nowrap;
      }

      .button.secondary {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
      }

      .button.subtle {
        height: 28px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        font-size: 11px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .panel-dock {
        display: flex;
        align-items: center;
        min-height: 56px;
        border-top: 1px solid var(--line);
        background: var(--surface);
        padding: 12px;
      }

      .rail-dock {
        justify-content: flex-end;
      }

      .inspector-dock {
        justify-content: space-between;
        gap: 12px;
      }

      .panel-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: 1px solid rgba(185, 194, 204, 0.72);
        border-radius: 999px;
        background: var(--surface);
        color: var(--muted);
        box-shadow: 0 4px 14px rgba(16, 24, 40, 0.08);
        transition:
          border-color 140ms ease,
          color 140ms ease,
          transform 140ms ease,
          background 140ms ease;
      }

      .panel-toggle:focus-visible {
        border-color: var(--accent);
        box-shadow:
          0 0 0 2px var(--accent-soft),
          0 4px 14px rgba(16, 24, 40, 0.08);
        outline: none;
      }

      .panel-toggle svg {
        display: none;
        width: 17px;
        height: 17px;
        stroke-width: 2;
      }

      .panel-toggle[data-state="expanded"] .panel-icon-expanded,
      .panel-toggle[data-state="collapsed"] .panel-icon-collapsed {
        display: block;
      }

      .app.rail-collapsed .rail-dock,
      .app.inspector-collapsed .inspector-dock {
        position: fixed;
        top: auto;
        right: auto;
        bottom: 12px;
        align-items: flex-end;
        justify-content: center;
        min-height: 0;
        border-top: 0;
        background: transparent;
        padding: 0;
        pointer-events: auto;
      }

      .app.rail-collapsed .rail-dock {
        left: 12px;
      }

      .app.inspector-collapsed .inspector-dock {
        right: 12px;
      }

      .app.inspector-collapsed #debugToggle {
        display: none;
      }

      @media (hover: hover) {
        .button:hover {
          background: #2a2d2a;
        }

        .button.secondary:hover,
        .button.subtle:hover,
        .preset-button:hover,
        .row-button:hover,
        .timeline-row:hover,
        .panel-toggle:hover {
          background: var(--surface-soft);
          border-color: var(--line-strong);
          color: var(--ink);
          transform: translateY(-1px);
        }
      }

      .results-pane {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 0;
      }

      .results-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
      }

      .count {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
      }

      .result-list {
        min-height: 0;
        overflow: auto;
      }

      .row-button {
        display: grid;
        width: 100%;
        gap: 6px;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        padding: 11px 12px;
        text-align: left;
      }

      .row-button.is-selected {
        background: var(--accent-soft);
        box-shadow: inset 3px 0 0 var(--accent);
      }

      .timeline-row.is-selected {
        background: var(--accent-soft);
        box-shadow: inset 3px 0 0 var(--accent);
      }

      .row-title {
        overflow: hidden;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 720;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 5px 9px;
        color: var(--muted);
        font-size: 11px;
      }

      .stage-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .stage-title {
        min-width: 0;
      }

      .stage-title strong {
        display: block;
        overflow: hidden;
        font-family: var(--mono);
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stage-title span {
        display: block;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .player-wrap {
        min-height: 0;
        overflow: auto;
      }

      #player {
        min-height: 0;
        width: 100%;
      }

      #player .rr-player {
        background: var(--surface) !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
      }

      #player .rr-player__frame,
      #player .replayer-wrapper {
        border-radius: 0 !important;
        box-shadow: none !important;
      }

      .empty,
      .error {
        display: grid;
        place-content: center;
        min-height: 320px;
        gap: 8px;
        color: var(--muted);
        text-align: center;
      }

      .empty strong,
      .error strong {
        color: var(--ink);
        font-size: 14px;
      }

      .error strong {
        color: var(--danger);
      }

      .facts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-bottom: 1px solid var(--line);
      }

      .fact {
        display: grid;
        gap: 3px;
        min-width: 0;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
      }

      .fact:nth-child(2n) {
        border-right: 0;
      }

      .fact:nth-last-child(-n + 2) {
        border-bottom: 0;
      }

      .fact span {
        color: var(--muted);
        font-size: 11px;
        font-weight: 680;
      }

      .fact strong {
        overflow: hidden;
        font-family: var(--mono);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .timeline {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 0;
      }

      .timeline-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
      }

      .timeline-list {
        overflow: auto;
      }

      .timeline-row {
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr);
        gap: 10px;
        width: 100%;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        padding: 9px 12px;
        text-align: left;
      }

      .timeline-time {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .timeline-main {
        min-width: 0;
      }

      .timeline-main strong,
      .timeline-main span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .timeline-main strong {
        font-size: 12px;
      }

      .timeline-main span {
        color: var(--muted);
        font-size: 11px;
      }

      .debug {
        display: none;
        border-top: 1px solid var(--line);
      }

      .debug.is-open {
        display: block;
      }

      .debug pre {
        max-height: 220px;
        overflow: auto;
        margin: 0;
        padding: 12px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .is-hidden {
        display: none !important;
      }

      @media (max-width: 1180px) {
        body {
          overflow: auto;
        }

        .app {
          --rail-track: 340px;
          --inspector-track: minmax(0, 1fr);
          grid-template-columns: var(--rail-track) minmax(0, 1fr);
          height: auto;
          min-height: 100vh;
        }

        .app.rail-collapsed {
          --rail-track: 0px;
        }

        .app.inspector-collapsed {
          --inspector-track: minmax(0, 1fr);
        }

        .inspector {
          grid-column: 1 / -1;
          min-height: 520px;
          border-top: 1px solid var(--line);
        }

        .app.inspector-collapsed .inspector {
          min-height: 0;
          border-top: 0;
        }
      }

      @media (max-width: 760px) {
        .app {
          --rail-track: 1fr;
          grid-template-columns: 1fr;
        }

        .app.rail-collapsed,
        .app.inspector-collapsed {
          grid-template-columns: 1fr;
        }

        .rail,
        .stage {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .filters {
          grid-template-columns: 1fr;
        }

        .date-inputs {
          grid-template-columns: 1fr;
        }

        .stage-head {
          align-items: stretch;
          flex-direction: column;
        }

        .stage-head .actions {
          display: flex;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app" id="app">
      <aside class="rail" id="rail">
        <div class="rail-content" id="railContent">
          <header class="topbar">
            <span class="brand-mark" aria-label="Hogflare" role="img">
              <svg viewBox="0 0 64 72" aria-hidden="true" fill="none" stroke="currentColor">
                <path
                  d="M12 54c-5-10-4-28 5-39C24 6 38 5 48 13c8 7 11 20 7 31-3 10-11 17-23 17-9 0-16-2-20-7Z"
                  stroke-width="4"
                  stroke-linejoin="round"
                />
                <path d="M19 18 13 8M29 12 27 3M42 14 45 5" stroke-width="4" stroke-linecap="round" />
                <path d="M24 25c-4-3-9-2-11 3M43 25c4-4 10-3 12 2" stroke-width="4" stroke-linecap="round" />
                <path
                  d="M23 42c3-5 15-6 20-1 3 3 2 8-2 11-6 4-17 3-21-1-3-3-1-7 3-9Z"
                  stroke-width="4"
                  stroke-linejoin="round"
                />
                <path d="M27 44v5M37 44v5" stroke-width="4" stroke-linecap="round" />
                <path d="M24 35h.1M42 35h.1" stroke-width="5" stroke-linecap="round" />
                <path d="M16 60v6M45 59v7" stroke-width="4" stroke-linecap="round" />
              </svg>
            </span>
            <span class="status" id="status" hidden>idle</span>
          </header>

          <section class="rail-body">
          <form class="filters" id="filters">
            <div class="field wide">
              <label class="label" for="apiKey">API key</label>
              <input id="apiKey" name="api_key" autocomplete="off" placeholder="phc_..." />
            </div>
            <div class="field">
              <label class="label" for="distinctId">Distinct ID</label>
              <input id="distinctId" name="distinct_id" autocomplete="off" placeholder="user_123" />
            </div>
            <div class="field">
              <label class="label" for="sessionId">Session ID</label>
              <input id="sessionId" name="session_id" autocomplete="off" placeholder="$session_id" />
            </div>
            <div class="field wide">
              <label class="label" for="url">URL contains</label>
              <input id="url" name="url" autocomplete="off" placeholder="/checkout" />
            </div>
            <div class="field wide">
              <label class="label" for="eventName">Event name</label>
              <input id="eventName" name="event_name" autocomplete="off" placeholder="Product Viewed" />
            </div>
            <div class="date-range" role="group" aria-labelledby="dateRangeLabel">
              <span class="label date-range-label" id="dateRangeLabel">Date range</span>
              <div class="date-presets" aria-label="Date range presets">
                <button class="preset-button" type="button" data-date-preset="today">Today</button>
                <button class="preset-button" type="button" data-date-preset="24h">Last 24h</button>
                <button class="preset-button" type="button" data-date-preset="7d">Last 7d</button>
                <button class="preset-button" type="button" data-date-preset="clear">Clear dates</button>
              </div>
              <div class="date-inputs">
                <label class="date-field" for="dateFrom">
                  <span>From</span>
                  <input id="dateFrom" name="date_from" type="datetime-local" autocomplete="off" step="60" />
                </label>
                <label class="date-field" for="dateTo">
                  <span>To</span>
                  <input id="dateTo" name="date_to" type="datetime-local" autocomplete="off" step="60" />
                </label>
              </div>
            </div>
            <div class="field">
              <label class="label" for="minDuration">Min duration</label>
              <input id="minDuration" name="min_duration_secs" inputmode="numeric" placeholder="sec" />
            </div>
            <div class="field">
              <label class="label" for="maxDuration">Max duration</label>
              <input id="maxDuration" name="max_duration_secs" inputmode="numeric" placeholder="sec" />
            </div>
            <div class="field">
              <label class="label" for="minEvents">Min events</label>
              <input id="minEvents" name="min_events" inputmode="numeric" placeholder="count" />
            </div>
            <div class="field">
              <label class="label" for="maxEvents">Max events</label>
              <input id="maxEvents" name="max_events" inputmode="numeric" placeholder="count" />
            </div>
            <div class="field wide">

          <section class="result-controls" aria-label="Replay result controls">

            <div class="mode-options" id="modeOptions">

              <div class="mode-panel mode-field" data-modes="friction">

                  <button class="chip-button" type="button" data-signal="rage_click">Rage clicks</button>
                  <button class="chip-button" type="button" data-signal="dead_click">Dead clicks</button>
                  <button class="chip-button" type="button" data-signal="repeated_navigation">Navigation</button>
                  <button class="chip-button" type="button" data-signal="long_idle">Idle</button>
                  <button class="chip-button" type="button" data-signal="form_thrash">Form thrash</button>
                  <button class="chip-button" type="button" data-signal="missed_cta">Missed CTA</button>

              </div>

          <div class="results-pane">
            <div class="results-head">
              <span class="label" id="resultsLabel">Recent sessions</span>
              <span class="count" id="resultCount">0</span>

            <div class="result-list" id="results"></div>
          </div>
          </section>
        </div>
        <div class="panel-dock rail-dock">
          <button
            class="panel-toggle"
            id="toggleRail"
            type="button"
            aria-controls="railContent"
            aria-expanded="true"
            aria-label="Hide filters"
            aria-pressed="false"
            data-state="expanded"
            title="Hide filters"
          >
            <span class="sr-only">Toggle filters</span>
            <svg
              class="panel-icon-expanded"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="4" y="5" width="16" height="14" rx="2" />
              <path d="M9 5v14" />
              <path d="m15 9-3 3 3 3" />
            </svg>
            <svg
              class="panel-icon-collapsed"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="4" y="5" width="16" height="14" rx="2" />

              <strong>Ready</strong>

      <aside class="inspector" id="inspector">
        <div class="inspector-content" id="inspectorContent">
          <header class="inspector-head">
            <h2>Session context</h2>

          <section class="facts" aria-label="Session facts">

              <span>User</span>
              <strong id="detailDistinct">-</strong>

            <div class="fact">

              <strong id="detailApiKey">-</strong>
            </div>
            <div class="fact">
              <span>Duration</span>
              <strong id="detailDuration">-</strong>
            </div>
            <div class="fact">
              <span>Events</span>
              <strong id="detailEvents">-</strong>
            </div>
            <div class="fact">
              <span>Chunks</span>
              <strong id="detailChunks">-</strong>
            </div>
            <div class="fact">
              <span>First URL</span>
              <strong id="detailUrl">-</strong>
            </div>
          </section>
          <section class="timeline">
            <div class="timeline-head">
              <span class="label" id="timelineLabel">Activity timeline</span>
              <span class="count" id="activityCount">0</span>
            </div>
            <div class="timeline-list" id="activity"></div>
          </section>
          <section class="debug" id="debug">
            <pre id="debugPayload">-</pre>
          </section>
        </div>
        <div class="panel-dock inspector-dock">
          <button
            class="panel-toggle"
            id="toggleInspector"
            type="button"
            aria-controls="inspectorContent"
            aria-expanded="true"
            aria-label="Hide context"
            aria-pressed="false"
            data-state="expanded"
            title="Hide context"
          >
            <span class="sr-only">Toggle context</span>
            <svg
              class="panel-icon-expanded"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="4" y="5" width="16" height="14" rx="2" />
              <path d="M15 5v14" />
              <path d="m9 9 3 3-3 3" />
            </svg>
            <svg
              class="panel-icon-collapsed"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="4" y="5" width="16" height="14" rx="2" />
              <path d="M15 5v14" />
              <path d="m12 9-3 3 3 3" />
            </svg>
          </button>
          <button class="button subtle" id="debugToggle" type="button">Debug payload</button>

      </aside>
    </main>

    <script>
      const els = {
        app: document.getElementById("app"),
        filters: document.getElementById("filters"),
        status: document.getElementById("status"),
        sessionMode: document.getElementById("sessionMode"),
        eventMode: document.getElementById("eventMode"),
        funnelMode: document.getElementById("funnelMode"),
        frictionMode: document.getElementById("frictionMode"),
        personMode: document.getElementById("personMode"),
        modeOptions: document.getElementById("modeOptions"),
        funnelStepControls: document.getElementById("funnelStepControls"),
        signalChoices: document.getElementById("signalChoices"),
        datePresets: document.querySelector(".date-presets"),
        submitButton: document.getElementById("submitButton"),
        clear: document.getElementById("clear"),
        reload: document.getElementById("reload"),
        toggleRail: document.getElementById("toggleRail"),
        toggleInspector: document.getElementById("toggleInspector"),
        copyLink: document.getElementById("copyLink"),
        resultsLabel: document.getElementById("resultsLabel"),
        resultCount: document.getElementById("resultCount"),
        results: document.getElementById("results"),
        player: document.getElementById("player"),
        activeTitle: document.getElementById("activeTitle"),
        activeSubtitle: document.getElementById("activeSubtitle"),
        detailDistinct: document.getElementById("detailDistinct"),
        detailApiKey: document.getElementById("detailApiKey"),
        detailDuration: document.getElementById("detailDuration"),
        detailEvents: document.getElementById("detailEvents"),
        detailChunks: document.getElementById("detailChunks"),
        detailUrl: document.getElementById("detailUrl"),
        timelineLabel: document.getElementById("timelineLabel"),
        activityCount: document.getElementById("activityCount"),
        activity: document.getElementById("activity"),
        debug: document.getElementById("debug"),
        debugToggle: document.getElementById("debugToggle"),
        debugPayload: document.getElementById("debugPayload"),
      };

      const state = {
        mode: "sessions",
        sessions: [],
        events: [],
        funnels: [],
        friction: [],
        person: null,
        selectedSession: null,
        selectedEvent: null,
        selectedFunnel: null,
        selectedFriction: null,
        selectedPersonItem: null,
        sessionPayload: null,
        player: null,
        playerEvents: [],
        playerAnchorMs: 0,
        playerWidth: 0,
        playerHeight: 0,
        playerResizeTimer: null,
        railCollapsed: false,
        inspectorCollapsed: false,
      };

      const playerControllerHeight = 80;

      const modes = {
        sessions: { label: "Recent sessions" },
        events: { label: "Analytics events" },
        funnels: { label: "Funnel replay" },
        friction: { label: "Friction signals" },
        person: { label: "Person journey" },
      };

      const funnelEventOptions = [
        "",
        "Viewed Pricing",
        "Checkout Started",
        "Product Viewed",
        "Paid",
        "Signed Up",
        "Demo Requested",
      ];
      const defaultFunnelSteps = ["Viewed Pricing", "Checkout Started", ""];

      function paramsFromForm(options = {}) {
        const params = new URLSearchParams();
        const data = new FormData(els.filters);
        const mode = options.mode || state.mode;
        const skip = skippedFields(mode);
        for (const [key, value] of data.entries()) {
          const trimmed = String(value).trim();
          if (!trimmed) continue;
          if (skip.has(key)) continue;
          params.set(key, valueForQuery(key, trimmed));
        }
        return params;
      }

      function valueForQuery(key, value) {
        if (key === "date_from" || key === "date_to") return dateInputToIso(value);
        return value;
      }

      function dateInputToIso(value) {
        const date = new Date(value);
        if (!Number.isFinite(date.getTime())) return value;
        return date.toISOString();
      }

      function skippedFields(mode) {
        const durationFields = ["min_duration_secs", "max_duration_secs", "min_events", "max_events"];
        const byMode = {
          sessions: ["steps", "signal"],
          events: [...durationFields, "steps", "signal"],
          funnels: [...durationFields, "event_name", "signal"],
          friction: ["event_name", "steps"],
          person: [...durationFields, "steps", "signal"],
          sessionLoad: ["session_id", "url", "event_name", "steps", "signal", ...durationFields],
        };
        return new Set(byMode[mode] || []);
      }

      function setField(name, value) {
        const input = els.filters.elements.namedItem(name);
        if (!input || !value) return;
        input.value = input.type === "datetime-local" ? isoToDateInput(value) : value;
      }

      function isoToDateInput(value) {
        const date = new Date(value);
        if (!Number.isFinite(date.getTime())) return value;
        return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}T${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
      }

      function pad2(value) {
        return String(value).padStart(2, "0");
      }

      function setDateRange(from, to) {
        document.getElementById("dateFrom").value = from ? isoToDateInput(from) : "";
        document.getElementById("dateTo").value = to ? isoToDateInput(to) : "";
      }

      function applyDatePreset(preset) {
        if (preset === "clear") {
          setDateRange(null, null);
          runSearch();
          return;
        }
        const to = new Date();
        const from = new Date(to);
        if (preset === "today") {
          from.setHours(0, 0, 0, 0);
        } else if (preset === "24h") {
          from.setDate(from.getDate() - 1);
        } else if (preset === "7d") {
          from.setDate(from.getDate() - 7);
        } else {
          return;
        }
        setDateRange(from, to);
        runSearch();
      }

      function setStatus(text, ok = false) {
        els.status.textContent = text;
        els.status.classList.toggle("is-ok", ok);
      }

      function initModeControls() {
        const selects = els.funnelStepControls.querySelectorAll("select");
        for (const select of selects) {
          select.innerHTML = "";
          for (const optionValue of funnelEventOptions) {
            const option = document.createElement("option");
            option.value = optionValue;
            option.textContent = optionValue || "None";
            select.appendChild(option);
          }
          select.value = defaultFunnelSteps[Number(select.dataset.stepIndex)] || "";
          select.addEventListener("change", () => {
            updateStepsFromControls();
            if (state.mode === "funnels") runSearch();
          });
        }
        updateStepsFromControls();

        for (const button of els.signalChoices.querySelectorAll("[data-signal]")) {
          button.addEventListener("click", () => setSignal(button.dataset.signal || "", { search: true }));
        }
        setSignal("");
      }

      function updateStepsFromControls() {
        const steps = Array.from(els.funnelStepControls.querySelectorAll("select"))
          .map((select) => select.value)
          .filter(Boolean);
        document.getElementById("steps").value = steps.join(",");
      }

      function setFunnelSteps(value) {
        const steps = String(value || "")
          .split(",")
          .map((step) => step.trim())
          .filter(Boolean);
        const selects = els.funnelStepControls.querySelectorAll("select");
        for (const select of selects) {
          const index = Number(select.dataset.stepIndex);
          const value = steps[index] ?? defaultFunnelSteps[index] ?? "";
          if (![...select.options].some((option) => option.value === value)) {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            select.appendChild(option);
          }
          select.value = value;
        }
        updateStepsFromControls();
      }

      function setSignal(value, options = {}) {
        const normalized = value || "";
        document.getElementById("signal").value = normalized;
        for (const button of els.signalChoices.querySelectorAll("[data-signal]")) {
          button.classList.toggle("is-selected", (button.dataset.signal || "") === normalized);
        }
        if (options.search && state.mode === "friction") runSearch();
      }

      function setMode(mode) {
        state.mode = mode;
        for (const [key, button] of [
          ["sessions", els.sessionMode],
          ["events", els.eventMode],
          ["funnels", els.funnelMode],
          ["friction", els.frictionMode],
          ["person", els.personMode],
        ]) {
          button.setAttribute("aria-selected", mode === key ? "true" : "false");
        }
        els.submitButton.textContent = "Search";
        els.resultsLabel.textContent = modes[mode].label;
        let hasModeOptions = false;
        for (const field of document.querySelectorAll(".mode-field")) {
          const enabled = field.dataset.modes.split(" ").includes(mode);
          field.classList.toggle("is-hidden", !enabled);
          hasModeOptions ||= enabled;
        }
        els.modeOptions.classList.toggle("is-hidden", !hasModeOptions);
        renderResults();
      }

      function formatTime(value) {
        if (!value) return "-";
        return new Intl.DateTimeFormat(undefined, {
          month: "short",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        }).format(new Date(value));
      }

      function formatDurationMs(ms) {
        if (!Number.isFinite(ms)) return "-";
        if (ms < 1000) return `${Math.max(0, ms)}ms`;
        const seconds = Math.round(ms / 1000);
        if (seconds < 60) return `${seconds}s`;
        const minutes = Math.floor(seconds / 60);
        return `${minutes}m ${seconds % 60}s`;
      }

      function formatOffset(ms) {
        const safe = Math.max(0, Math.round(ms || 0));
        const seconds = Math.floor(safe / 1000);
        return `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
      }

      function showMessage(kind, title, body) {
        destroyPlayer();
        state.playerEvents = [];
        state.playerAnchorMs = 0;
        state.playerWidth = 0;
        state.playerHeight = 0;
        els.player.style.minHeight = "";
        els.player.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = kind === "error" ? "error" : "empty";
        const strong = document.createElement("strong");
        strong.textContent = title;
        const span = document.createElement("span");
        span.textContent = body;
        wrap.append(strong, span);
        els.player.appendChild(wrap);
      }

      function renderResults() {
        els.results.innerHTML = "";
        const items = resultItems();
        els.resultCount.textContent = String(items.length);
        for (const item of items) {
          els.results.appendChild(resultRow(item));
        }
      }

      function resultItems() {
        if (state.mode === "events") return state.events;
        if (state.mode === "funnels") return state.funnels;
        if (state.mode === "friction") return state.friction;
        if (state.mode === "person") return state.person?.timeline || [];
        return state.sessions;
      }

      function resultRow(item) {
        if (state.mode === "events") return eventRow(item);
        if (state.mode === "funnels") return funnelRow(item);
        if (state.mode === "friction") return frictionRow(item);
        if (state.mode === "person") return personRow(item);
        return sessionRow(item);
      }

      function sessionRow(session) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "row-button";
        row.classList.toggle("is-selected", state.selectedSession?.session_id === session.session_id);
        row.addEventListener("click", () => loadSession(session.session_id, 0));

        const title = document.createElement("div");
        title.className = "row-title";
        title.textContent = session.session_id;

        const meta = document.createElement("div");
        meta.className = "row-meta";
        meta.append(
          textNode(session.distinct_id),
          textNode(`${session.event_count} events`),
          textNode(formatDurationMs(session.duration_ms)),
          textNode(session.first_url || "no url"),
        );

        row.append(title, meta);
        return row;
      }

      function eventRow(event) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "row-button";
        row.classList.toggle("is-selected", state.selectedEvent?.uuid === event.uuid);
        row.addEventListener("click", () => selectEvent(event));

        const title = document.createElement("div");
        title.className = "row-title";
        title.textContent = event.event;

        const meta = document.createElement("div");
        meta.className = "row-meta";
        meta.append(
          textNode(event.distinct_id),
          textNode(event.session_id || "no session id"),
          textNode(formatTime(event.created_at)),
        );
        if (event.url) meta.append(textNode(event.url));

        row.append(title, meta);
        return row;
      }

      function funnelRow(session) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "row-button";
        row.classList.toggle("is-selected", state.selectedFunnel === session);
        row.addEventListener("click", () => selectFunnel(session));

        const title = document.createElement("div");
        title.className = "row-title";
        title.textContent = `${session.status} · ${session.current_step || "step"}`;

        const meta = document.createElement("div");
        meta.className = "row-meta";
        meta.append(
          textNode(session.distinct_id),
          textNode(session.session_id || "no session id"),
          textNode(`${session.completed_steps}/${session.step_count}`),
        );
        if (session.drop_off_step) meta.append(textNode(`next ${session.drop_off_step}`));
        if (session.url) meta.append(textNode(session.url));

        row.append(title, meta);
        return row;
      }

      function frictionRow(item) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "row-button";
        row.classList.toggle("is-selected", state.selectedFriction === item);
        row.addEventListener("click", () => selectFriction(item));

        const signal = item.signals[0];
        const title = document.createElement("div");
        title.className = "row-title";
        title.textContent = `${item.score} · ${signal?.label || "Signal"}`;

        const meta = document.createElement("div");
        meta.className = "row-meta";
        meta.append(
          textNode(item.session.distinct_id),
          textNode(item.session.session_id),
          textNode(`${item.signals.length} signals`),
        );
        if (signal?.detail) meta.append(textNode(signal.detail));

        row.append(title, meta);
        return row;
      }

      function personRow(item) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "row-button";
        row.classList.toggle("is-selected", state.selectedPersonItem === item);
        row.addEventListener("click", () => selectPersonItem(item));

        const title = document.createElement("div");
        title.className = "row-title";
        title.textContent = `${item.kind} · ${item.title}`;

        const meta = document.createElement("div");
        meta.className = "row-meta";
        meta.append(textNode(formatTime(item.timestamp)), textNode(item.session_id || "no session id"));
        if (item.url) meta.append(textNode(item.url));
        if (item.detail) meta.append(textNode(item.detail));

        row.append(title, meta);
        return row;
      }

      function textNode(value) {
        const span = document.createElement("span");
        span.textContent = value;
        return span;
      }

      async function requestJson(path, params) {
        const query = params?.toString();
        const response = await fetch(query ? `${path}?${query}` : path);
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || "Replay request failed.");
        return body;
      }

      async function loadSessions(options = {}) {
        setStatus("loading");
        const body = await requestJson("/replay/api/sessions", paramsFromForm({ mode: "sessions" }));
        state.sessions = body.sessions || [];
        if (!options.keepSelection) {
          state.selectedSession = null;
          state.sessionPayload = null;
        }
        renderResults();
        setStatus(`${state.sessions.length} sessions`, true);
        if (!state.sessions.length) {
          showMessage("empty", "No sessions", "No matching replay chunks were found.");
          renderFacts(null);
          renderActivity([]);
        } else if (!options.silent) {
          showMessage("empty", "Select a session", "Replay rows are ready.");
        }
      }

      async function loadEvents() {
        setStatus("loading");
        const body = await requestJson("/replay/api/events", paramsFromForm({ mode: "events" }));
        state.events = body.events || [];
        state.selectedEvent = null;
        renderResults();
        setStatus(`${state.events.length} events`, true);
        renderEventContext();
      }

      async function loadFunnels() {
        setStatus("loading");
        const body = await requestJson("/replay/api/funnels", paramsFromForm({ mode: "funnels" }));
        state.funnels = body.sessions || [];
        state.selectedFunnel = null;
        renderResults();
        setStatus(`${state.funnels.length} funnel sessions`, true);
        renderFunnelContext(body);
      }

      async function loadFriction() {
        setStatus("loading");
        const body = await requestJson("/replay/api/friction", paramsFromForm({ mode: "friction" }));
        state.friction = body.sessions || [];
        state.selectedFriction = null;
        renderResults();
        setStatus(`${state.friction.length} flagged sessions`, true);
        renderFrictionContext();
      }

      async function loadPerson() {
        setStatus("loading");
        const body = await requestJson("/replay/api/person", paramsFromForm({ mode: "person" }));
        state.person = body;
        state.selectedPersonItem = null;
        renderResults();
        setStatus(`${(body.timeline || []).length} journey items`, true);
        renderPersonContext();
      }

      async function loadSession(sessionId, atMs = 0) {
        setStatus("loading");
        const params = paramsFromForm({ mode: "sessionLoad" });
        params.delete("session_id");
        if (Number.isFinite(atMs) && atMs > 0) params.set("at_ms", String(Math.round(atMs)));
        const body = await requestJson(`/replay/api/sessions/${encodeURIComponent(sessionId)}`, params);
        state.selectedSession = body.session;
        state.sessionPayload = body;
        renderResults();
        renderFacts(body.session);
        renderActivity(body.activity || []);
        renderPlayer(body.events || [], body.replay_anchor_ms || atMs || 0);
        writeDeepLink(body.session.session_id, body.replay_anchor_ms || atMs || 0);
        setStatus("ready", true);
      }

      async function selectEvent(event) {
        state.selectedEvent = event;
        setField("distinct_id", event.distinct_id);
        setField("session_id", event.session_id);
        renderResults();
        renderEventContext();
        await loadSessions({ silent: true, keepSelection: true });
        const match = state.sessions.find((session) => session.session_id === event.session_id) || state.sessions[0];
        if (!match) {
          showMessage("empty", "No recording", "No replay session matched this analytics event.");
          return;
        }
        await loadSession(match.session_id, anchorForEvent(event, match));
      }

      async function selectFunnel(session) {
        state.selectedFunnel = session;
        state.selectedEvent = null;
        renderResults();
        renderFunnelContext({ sessions: [session], steps: session.steps?.map((step) => step.event) || [] });
        await openReplayForAnalytics(
          session.session_id,
          session.distinct_id,
          session.steps?.at(-1)?.created_at,
        );
      }

      async function selectFriction(item) {
        state.selectedFriction = item;
        renderResults();
        renderFrictionContext(item);
        const signal = item.signals[0];
        setField("distinct_id", item.session.distinct_id);
        setField("session_id", item.session.session_id);
        await loadSession(item.session.session_id, signal?.replay_anchor_ms || 0);
      }

      async function selectPersonItem(item) {
        state.selectedPersonItem = item;
        renderResults();
        renderPersonContext(item);
        if (item.kind === "session" && item.session_id) {
          setField("session_id", item.session_id);
          await loadSession(item.session_id, 0);
          return;
        }
        await openReplayForAnalytics(item.session_id, null, item.timestamp);
      }

      async function openReplayForAnalytics(sessionId, distinctId, createdAt) {
        if (!sessionId) {
          showMessage("empty", "No recording", "This item does not have a replay session id.");
          return;
        }
        if (distinctId) setField("distinct_id", distinctId);
        setField("session_id", sessionId);
        await loadSessions({ silent: true, keepSelection: true });
        const match = state.sessions.find((session) => session.session_id === sessionId) || state.sessions[0];
        if (!match) {
          showMessage("empty", "No recording", "No replay session matched this item.");
          return;
        }
        await loadSession(match.session_id, anchorForTimestamp(createdAt, match));
      }

      function anchorForEvent(event, session) {
        return anchorForTimestamp(event.created_at, session);
      }

      function anchorForTimestamp(value, session) {
        const eventAt = new Date(value).getTime();
        const sessionStart = new Date(session.first_seen).getTime();
        if (!Number.isFinite(eventAt) || !Number.isFinite(sessionStart)) return 0;
        return Math.max(0, eventAt - sessionStart);
      }

      function renderFacts(session) {
        els.activeTitle.textContent = session?.session_id || "No session selected";
        els.activeSubtitle.textContent = session
          ? `${session.distinct_id} · ${formatDurationMs(session.duration_ms)} · ${session.event_count} rrweb events`
          : "Search replay sessions or choose an analytics event.";
        els.detailDistinct.textContent = session?.distinct_id || "-";
        els.detailApiKey.textContent = session?.api_key || "-";
        els.detailDuration.textContent = session ? formatDurationMs(session.duration_ms) : "-";
        els.detailEvents.textContent = session ? String(session.event_count) : "-";
        els.detailChunks.textContent = session ? String(session.chunk_count) : "-";
        els.detailUrl.textContent = session?.first_url || "-";
      }

      function renderActivity(activity) {
        els.timelineLabel.textContent = state.selectedEvent
          ? "Activity near event"
          : state.selectedFunnel
            ? "Funnel replay activity"
            : state.selectedFriction
              ? "Friction replay activity"
              : "Activity timeline";
        els.activity.innerHTML = "";
        els.activityCount.textContent = String(activity.length);
        if (!activity.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.innerHTML = "<strong>No activity</strong><span>Select a replay with decoded rrweb events.</span>";
          els.activity.appendChild(empty);
          setDebugPayload();
          return;
        }

        for (const item of activity) {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "timeline-row";
          row.addEventListener("click", () => {
            if (state.sessionPayload?.events) renderPlayer(state.sessionPayload.events, item.replay_anchor_ms);
          });

          const time = document.createElement("span");
          time.className = "timeline-time";
          time.textContent = formatOffset(item.offset_ms);

          const main = document.createElement("span");
          main.className = "timeline-main";
          const strong = document.createElement("strong");
          strong.textContent = item.label;
          const detail = document.createElement("span");
          detail.textContent = item.url || item.detail || item.kind;
          main.append(strong, detail);
          row.append(time, main);
          els.activity.appendChild(row);
        }
        setDebugPayload();
      }

      function renderEventContext() {
        if (!state.selectedEvent) return;
        const event = state.selectedEvent;
        els.timelineLabel.textContent = "Event context";
        els.activity.innerHTML = "";
        const related = state.events
          .filter((candidate) => candidate.distinct_id === event.distinct_id)
          .slice(0, 12);
        els.activityCount.textContent = String(related.length);
        for (const candidate of related) {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "timeline-row";
          row.addEventListener("click", () => selectEvent(candidate));
          const time = document.createElement("span");
          time.className = "timeline-time";
          time.textContent = formatTime(candidate.created_at);
          const main = document.createElement("span");
          main.className = "timeline-main";
          const strong = document.createElement("strong");
          strong.textContent = candidate.event;
          const detail = document.createElement("span");
          detail.textContent = candidate.url || candidate.session_id || candidate.uuid;
          main.append(strong, detail);
          row.append(time, main);
          els.activity.appendChild(row);
        }
        setDebugPayload();
      }

      function renderFunnelContext(body = null) {
        els.timelineLabel.textContent = "Funnel context";
        els.activity.innerHTML = "";
        const sessions = body?.sessions || state.funnels || [];
        els.activityCount.textContent = String(sessions.length);
        if (!sessions.length) {
          renderTimelineEmpty("No funnel sessions", "Run a funnel query with ordered event names.");
          return;
        }
        for (const session of sessions.slice(0, 16)) {
          appendTimelineRow(
            `${session.completed_steps}/${session.step_count}`,
            session.status,
            session.drop_off_step ? `next ${session.drop_off_step}` : session.current_step || session.distinct_id,
            () => selectFunnel(session),
          );
        }
        setDebugPayload();
      }

      function renderFrictionContext(item = null) {
        els.timelineLabel.textContent = item ? "Friction signals" : "Top friction signals";
        els.activity.innerHTML = "";
        const signals = item
          ? item.signals
          : state.friction.flatMap((session) =>
              session.signals.map((signal) => ({ ...signal, session })),
            );
        els.activityCount.textContent = String(signals.length);
        if (!signals.length) {
          renderTimelineEmpty("No friction signals", "No computed replay signal matched this query.");
          return;
        }
        for (const signal of signals.slice(0, 18)) {
          appendTimelineRow(
            signal.severity || "signal",
            signal.label,
            signal.detail || signal.kind,
            () => {
              if (signal.session) selectFriction(signal.session);
              else if (item) loadSession(item.session.session_id, signal.replay_anchor_ms || 0);
            },
          );
        }
        setDebugPayload();
      }

      function renderPersonContext(selected = null) {
        els.timelineLabel.textContent = "Person journey";
        els.activity.innerHTML = "";
        const timeline = state.person?.timeline || [];
        els.activityCount.textContent = String(timeline.length);
        if (!timeline.length) {
          renderTimelineEmpty("No journey", "No events or sessions matched this person.");
          return;
        }
        for (const item of timeline.slice(0, 24)) {
          appendTimelineRow(
            item.kind === "session" ? "replay" : formatTime(item.timestamp),
            item.title,
            item.detail || item.session_id || item.url || "journey item",
            () => selectPersonItem(item),
            selected === item,
          );
        }
        setDebugPayload();
      }

      function appendTimelineRow(timeText, titleText, detailText, onClick, selected = false) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "timeline-row";
        row.classList.toggle("is-selected", selected);
        row.addEventListener("click", onClick);
        const time = document.createElement("span");
        time.className = "timeline-time";
        time.textContent = timeText;
        const main = document.createElement("span");
        main.className = "timeline-main";
        const strong = document.createElement("strong");
        strong.textContent = titleText;
        const detail = document.createElement("span");
        detail.textContent = detailText;
        main.append(strong, detail);
        row.append(time, main);
        els.activity.appendChild(row);
      }

      function renderTimelineEmpty(title, body) {
        els.activity.innerHTML = "";
        const empty = document.createElement("div");
        empty.className = "empty";
        const strong = document.createElement("strong");
        strong.textContent = title;
        const span = document.createElement("span");
        span.textContent = body;
        empty.append(strong, span);
        els.activity.appendChild(empty);
        setDebugPayload();
      }

      function renderPlayer(events, anchorMs = 0) {
        state.playerEvents = events;
        state.playerAnchorMs = Math.max(0, Math.round(anchorMs || 0));
        destroyPlayer();
        els.player.innerHTML = "";
        if (!events.length) {
          showMessage("empty", "No playable events", "The selected chunks did not contain rrweb events.");
          return;
        }
        if (typeof rrwebPlayer === "undefined") {
          showMessage("error", "Player unavailable", "rrweb-player did not load.");
          return;
        }

        const { width, height } = playerDimensions();
        state.playerWidth = width;
        state.playerHeight = height;
        els.player.style.minHeight = `${height + playerControllerHeight}px`;
        state.player = new rrwebPlayer({
          target: els.player,
          props: {
            events,
            width,
            height,
            autoPlay: false,
            showController: true,
          },
        });
        fitReplayViewport();
        seekPlayer(state.playerAnchorMs);
      }

      function destroyPlayer() {
        try {
          if (state.player?.$destroy) state.player.$destroy();
          else if (state.player?.destroy) state.player.destroy();
        } catch (_) {}
        state.player = null;
      }

      function playerDimensions() {
        const wrap = els.player.parentElement;
        const width = Math.max(320, Math.floor(wrap?.clientWidth || els.player.clientWidth || 960));
        const availableHeight = Math.floor(wrap?.clientHeight || els.player.clientHeight || 0);
        const aspectRatio = playerAspectRatio();
        const fullWidthHeight = Math.round(width / aspectRatio);
        const constrainedHeight =
          availableHeight > playerControllerHeight + 240
            ? Math.min(fullWidthHeight, availableHeight - playerControllerHeight)
            : fullWidthHeight;
        const height = Math.max(240, constrainedHeight);
        return { width, height };
      }

      function playerAspectRatio() {
        const meta = state.playerEvents.find(
          (event) => event?.type === 4 && event?.data?.width > 0 && event?.data?.height > 0,
        );
        if (!meta) return 16 / 9;
        return meta.data.width / meta.data.height;
      }

      function fitReplayViewport() {
        const applyFit = () => {
          const frame = els.player.querySelector(".rr-player__frame");
          const wrapper = els.player.querySelector(".replayer-wrapper");
          if (!frame || !wrapper) return;
          const naturalWidth = wrapper.offsetWidth;
          const naturalHeight = wrapper.offsetHeight;
          if (!naturalWidth || !naturalHeight) return;
          const scale = Math.min(frame.clientWidth / naturalWidth, frame.clientHeight / naturalHeight);
          wrapper.style.transform = `scale(${scale}) translate(-50%, -50%)`;
        };
        window.requestAnimationFrame(applyFit);
        window.setTimeout(applyFit, 0);
        window.setTimeout(applyFit, 180);
      }

      function resizePlayer() {
        if (!state.playerEvents.length || typeof rrwebPlayer === "undefined") return;
        const { width, height } = playerDimensions();
        if (width === state.playerWidth && height === state.playerHeight) return;
        renderPlayer(state.playerEvents, state.playerAnchorMs);
      }

      function schedulePlayerResize() {
        window.clearTimeout(state.playerResizeTimer);
        state.playerResizeTimer = window.setTimeout(resizePlayer, 120);
      }

      function seekPlayer(anchorMs) {
        const offset = Math.max(0, Math.round(anchorMs || 0));
        window.setTimeout(() => {
          try {
            if (state.player?.goto) {
              state.player.goto(offset, false);
            } else if (state.player?.getReplayer) {
              const replayer = state.player.getReplayer();
              if (replayer?.play && replayer?.pause) {
                replayer.play(offset);
                window.setTimeout(() => replayer.pause(), 40);
              }
            }
          } catch (_) {}
          fitReplayViewport();
        }, 100);
      }

      function writeDeepLink(sessionId, atMs) {
        const params = paramsFromForm({ mode: "sessionLoad" });
        params.set("session_id", sessionId);
        if (atMs) params.set("at_ms", String(Math.round(atMs)));
        history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
      }

      async function copyLink() {
        await navigator.clipboard.writeText(location.href);
        setStatus("copied", true);
      }

      function setRailCollapsed(collapsed) {
        state.railCollapsed = collapsed;
        els.app.classList.toggle("rail-collapsed", collapsed);
        els.toggleRail.dataset.state = collapsed ? "collapsed" : "expanded";
        els.toggleRail.setAttribute("aria-label", collapsed ? "Show filters" : "Hide filters");
        els.toggleRail.setAttribute("title", collapsed ? "Show filters" : "Hide filters");
        els.toggleRail.setAttribute("aria-pressed", String(collapsed));
        els.toggleRail.setAttribute("aria-expanded", String(!collapsed));
        window.requestAnimationFrame(schedulePlayerResize);
      }

      function setInspectorCollapsed(collapsed) {
        state.inspectorCollapsed = collapsed;
        els.app.classList.toggle("inspector-collapsed", collapsed);
        els.toggleInspector.dataset.state = collapsed ? "collapsed" : "expanded";
        els.toggleInspector.setAttribute("aria-label", collapsed ? "Show context" : "Hide context");
        els.toggleInspector.setAttribute("title", collapsed ? "Show context" : "Hide context");
        els.toggleInspector.setAttribute("aria-pressed", String(collapsed));
        els.toggleInspector.setAttribute("aria-expanded", String(!collapsed));
        window.requestAnimationFrame(schedulePlayerResize);
      }

      function setDebugPayload() {
        els.debugPayload.textContent = JSON.stringify(
          {
            selectedSession: state.selectedSession,
            selectedEvent: state.selectedEvent,
            selectedFunnel: state.selectedFunnel,
            selectedFriction: state.selectedFriction,
            selectedPersonItem: state.selectedPersonItem,
            chunks: state.sessionPayload?.chunks,
          },
          null,
          2,
        );
      }

      async function runSearch() {
        try {
          if (state.mode === "sessions") await loadSessions();
          else if (state.mode === "events") await loadEvents();
          else if (state.mode === "funnels") await loadFunnels();
          else if (state.mode === "friction") await loadFriction();
          else await loadPerson();
        } catch (error) {
          setStatus("error");
          showMessage("error", "Replay unavailable", error.message);
        }
      }

      function switchMode(mode) {
        setMode(mode);
        runSearch();
      }

      els.filters.addEventListener("submit", (event) => {
        event.preventDefault();
        runSearch();
      });
      els.sessionMode.addEventListener("click", () => switchMode("sessions"));
      els.eventMode.addEventListener("click", () => switchMode("events"));
      els.funnelMode.addEventListener("click", () => switchMode("funnels"));
      els.frictionMode.addEventListener("click", () => switchMode("friction"));
      els.personMode.addEventListener("click", () => switchMode("person"));
      els.reload.addEventListener("click", runSearch);
      els.toggleRail.addEventListener("click", () => setRailCollapsed(!state.railCollapsed));
      els.toggleInspector.addEventListener("click", () =>
        setInspectorCollapsed(!state.inspectorCollapsed),
      );
      els.datePresets.addEventListener("click", (event) => {
        const button = event.target.closest("[data-date-preset]");
        if (!button) return;
        applyDatePreset(button.dataset.datePreset);
      });
      els.copyLink.addEventListener("click", () => copyLink().catch(() => setStatus("copy failed")));
      els.debugToggle.addEventListener("click", () => els.debug.classList.toggle("is-open"));
      els.clear.addEventListener("click", () => {
        els.filters.reset();
        document.getElementById("limit").value = "100";
        setFunnelSteps(defaultFunnelSteps.join(","));
        setSignal("");
        state.sessions = [];
        state.events = [];
        state.funnels = [];
        state.friction = [];
        state.person = null;
        state.selectedSession = null;
        state.selectedEvent = null;
        state.selectedFunnel = null;
        state.selectedFriction = null;
        state.selectedPersonItem = null;
        state.sessionPayload = null;
        renderResults();
        renderFacts(null);
        renderActivity([]);
        setStatus("idle");
        showMessage("empty", "Ready", "Load sessions, then select a recording to replay.");
        history.replaceState(null, "", location.pathname);
      });

      function bootFromUrl() {
        const params = new URLSearchParams(location.search);
        for (const [key, value] of params.entries()) {
          if (key === "at_ms" || key === "mode") continue;
          setField(key, value);
        }
        setFunnelSteps(params.get("steps") || document.getElementById("steps").value);
        setSignal(params.get("signal") || "");
        const sessionId = params.get("session_id");
        const atMs = Number(params.get("at_ms") || 0);
        if (sessionId) {
          setMode("sessions");
          loadSessions({ silent: true, keepSelection: true })
            .then(() => loadSession(sessionId, Number.isFinite(atMs) ? atMs : 0))
            .catch((error) => showMessage("error", "Replay unavailable", error.message));
        } else if (modes[params.get("mode")]) {
          setMode(params.get("mode"));
          runSearch();
        } else {
          setMode("sessions");
          renderActivity([]);
        }
      }

      window.addEventListener("resize", schedulePlayerResize);
      if (window.ResizeObserver) {
        new ResizeObserver(schedulePlayerResize).observe(els.player.parentElement);
      }

      initModeControls();
      bootFromUrl();
    </script>
  </body>
</html>
