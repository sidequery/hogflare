<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hogflare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/index.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f8;
        --surface: #ffffff;
        --surface-soft: #eef1f4;
        --ink: #0b0d10;
        --muted: #5c6670;
        --faint: #7b8490;
        --line: #dbe1e7;
        --line-strong: #b9c2cc;
        --accent: #087a55;
        --accent-soft: #e3f4eb;
        --danger: #9d332b;
        --mono:
          "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
      }

      body {
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1.35;
        text-rendering: geometricPrecision;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .app {
        display: grid;
        --rail-track: minmax(320px, 380px);
        --inspector-track: minmax(330px, 420px);
        --analytics-nav-width: 320px;
        grid-template-columns: var(--rail-track) minmax(560px, 1fr) var(--inspector-track);
        height: 100vh;
        min-height: 0;
      }

      .app.rail-collapsed {
        --rail-track: 0px;
      }

      .app.inspector-collapsed {
        --inspector-track: 0px;
      }

      .rail,
      .stage,
      .inspector {
        min-height: 0;
        min-width: 0;
        background: var(--surface);
      }

      .rail {
        position: relative;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        border-right: 1px solid var(--line);
      }

      .rail-content {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 0;
      }

      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr);
        border-right: 1px solid var(--line);
      }

      .app.inspector-collapsed .stage {
        border-right: 0;
      }

      .inspector {
        position: relative;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
      }

      .inspector-content {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        min-height: 0;
      }

      .app.rail-collapsed .rail-content,
      .app.inspector-collapsed .inspector-content {
        display: none;
      }

      .app.rail-collapsed .rail,
      .app.inspector-collapsed .inspector {
        border: 0;
        background: transparent;
        pointer-events: none;
        z-index: 20;
      }

      .app.analytics-mode {
        --rail-track: 0px;
      }

      .app.analytics-mode .rail {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 30;
        width: var(--analytics-nav-width);
        height: 56px;
        min-height: 56px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        pointer-events: auto;
      }

      .app.analytics-mode .rail-content {
        display: block;
      }

      .app.analytics-mode .topbar {
        border-bottom: 0;
      }

      .app.analytics-mode .rail-body,
      .app.analytics-mode .rail-dock {
        display: none;
      }

      .app.analytics-mode .stage-head {
        padding-left: calc(var(--analytics-nav-width) + 16px);
      }

      .app.analytics-mode .stage {
        grid-column: 1 / -1;
      }

      .topbar,
      .stage-head,
      .inspector-head {
        height: 56px;
        border-bottom: 1px solid var(--line);
        padding: 8px 16px;
      }

      .inspector-head {
        display: flex;
        align-items: center;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        justify-content: space-between;
      }

      .topbar-primary {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 12px;
      }

      .brand-mark {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 32px;
        color: var(--ink);
      }

      .brand-mark svg {
        display: block;
        width: 28px;
        height: 32px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 15px;
        font-weight: 720;
        letter-spacing: 0;
      }

      h2 {
        font-size: 14px;
        font-weight: 720;
      }

      .eyebrow,
      .label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 680;
        letter-spacing: 0;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .status::before {
        display: block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--line-strong);
        content: "";
      }

      .status.is-ok::before {
        background: var(--accent);
      }

      .status.is-loading::before {
        width: 8px;
        height: 8px;
        border: 2px solid var(--line-strong);
        border-top-color: var(--accent);
        background: transparent;
        animation: spin 700ms linear infinite;
      }

      .status[hidden] {
        display: none !important;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .section-switch {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 2px;
      }

      .section-button {
        height: 28px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        padding: 0 10px;
        font-size: 12px;
        font-weight: 720;
        white-space: nowrap;
      }

      .section-button[aria-selected="true"] {
        background: var(--ink);
        color: var(--surface);
      }

      .mode-switch {
        display: flex;
        gap: 5px;
        overflow-x: auto;
        background: transparent;
      }

      .mode-button {
        height: 28px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--muted);
        padding: 0 9px;
        font-size: 11px;
        font-weight: 680;
        white-space: nowrap;
      }

      .mode-button[aria-selected="true"] {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--surface);
      }

      .filters {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        padding: 12px;
      }

      .rail-body {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        min-height: 0;
      }

      .result-controls {
        display: grid;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
      }

      .mode-options {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .mode-panel {
        display: grid;
        gap: 8px;
      }

      .section-controls {
        display: grid;
        grid-column: 1 / -1;
        gap: 10px;
      }

      .analytics-query-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
      }

      .semantic-filter-block {
        display: grid;
        gap: 6px;
      }

      .semantic-filter-strip {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
      }

      .semantic-filter-pill {
        display: inline-flex;
        align-items: center;
        max-width: 100%;
        gap: 5px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--muted);
        font-size: 11px;
        line-height: 1;
        padding: 5px 6px 5px 8px;
      }

      .semantic-filter-pill span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .semantic-filter-pill button {
        display: grid;
        place-items: center;
        width: 16px;
        height: 16px;
        border: 0;
        border-radius: 999px;
        background: var(--surface-soft);
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        padding: 0;
      }

      .select-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }

      .select-field {
        display: grid;
        min-width: 0;
        gap: 5px;
      }

      .select-field select {
        width: 100%;
        height: 32px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--ink);
        padding: 0 8px;
        outline: none;
        font-size: 12px;
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip-button {
        height: 28px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--muted);
        padding: 0 9px;
        font-size: 11px;
        font-weight: 680;
      }

      .chip-button.is-selected {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--ink);
      }

      .date-range {
        display: grid;
        grid-column: 1 / -1;
        min-inline-size: 0;
        min-width: 0;
        gap: 8px;
        margin: 0;
        padding: 0;
      }

      .date-range-label {
        display: block;
      }

      .date-inputs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .date-field {
        display: grid;
        min-width: 0;
        gap: 5px;
      }

      .date-field span {
        color: var(--muted);
        font-size: 11px;
        font-weight: 680;
      }

      .date-presets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .preset-button {
        height: 26px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--muted);
        padding: 0 8px;
        font-size: 11px;
        font-weight: 680;
      }

      .preset-button.is-selected {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--ink);
      }

      .field {
        display: grid;
        min-width: 0;
        gap: 5px;
      }

      .field.wide {
        grid-column: 1 / -1;
      }

      .field input,
      .field select,
      .date-field input {
        width: 100%;
        height: 34px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--ink);
        padding: 0 9px;
        outline: none;
        font-size: 12px;
      }

      .field select {
        cursor: pointer;
      }

      .date-field input {
        padding-right: 6px;
      }

      .date-field input::-webkit-calendar-picker-indicator {
        cursor: pointer;
        opacity: 0.7;
      }

      .field input:focus,
      .field select:focus,
      .date-field input:focus,
      .analytics-filter-popover input:focus,
      .analytics-filter-popover select:focus,
      .analytics-date-popover input:focus,
      .analytics-date-popover select:focus,
      .analytics-grain-select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }

      .actions {
        display: flex;
        grid-column: 1 / -1;
        gap: 8px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        height: 34px;
        border-radius: 5px;
        padding: 0 11px;
        background: var(--ink);
        color: var(--surface);
        font-size: 12px;
        font-weight: 720;
        white-space: nowrap;
      }

      .button.secondary {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
      }

      .button.subtle {
        height: 28px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        font-size: 11px;
      }

      .button:disabled,
      .preset-button:disabled,
      .mode-button:disabled,
      .section-button:disabled,
      .chip-button:disabled,
      .analytics-filter-trigger:disabled {
        cursor: wait;
        opacity: 0.56;
        transform: none !important;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .panel-dock {
        display: flex;
        align-items: center;
        min-height: 56px;
        border-top: 1px solid var(--line);
        background: var(--surface);
        padding: 12px;
      }

      .rail-dock {
        justify-content: flex-end;
      }

      .inspector-dock {
        justify-content: space-between;
        gap: 12px;
      }

      .panel-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: 1px solid rgba(185, 194, 204, 0.72);
        border-radius: 999px;
        background: var(--surface);
        color: var(--muted);
        box-shadow: 0 4px 14px rgba(16, 24, 40, 0.08);
        transition:
          border-color 140ms ease,
          color 140ms ease,
          transform 140ms ease,
          background 140ms ease;
      }

      .panel-toggle:focus-visible {
        border-color: var(--accent);
        box-shadow:
          0 0 0 2px var(--accent-soft),
          0 4px 14px rgba(16, 24, 40, 0.08);
        outline: none;
      }

      .panel-toggle svg {
        display: none;
        width: 17px;
        height: 17px;
        stroke-width: 2;
      }

      .panel-toggle[data-state="expanded"] .panel-icon-expanded,
      .panel-toggle[data-state="collapsed"] .panel-icon-collapsed {
        display: block;
      }

      .app.rail-collapsed .rail-dock,
      .app.inspector-collapsed .inspector-dock {
        position: fixed;
        top: auto;
        right: auto;
        bottom: 12px;
        align-items: flex-end;
        justify-content: center;
        min-height: 0;
        border-top: 0;
        background: transparent;
        padding: 0;
        pointer-events: auto;
      }

      .app.rail-collapsed .rail-dock {
        left: 12px;
      }

      .app.inspector-collapsed .inspector-dock {
        right: 12px;
      }

      .app.inspector-collapsed #debugToggle {
        display: none;
      }

      .app.inspector-unavailable .inspector-dock {
        display: none;
      }

      @media (hover: hover) {
        .button:hover {
          background: #2a2d2a;
        }

        .button.secondary:hover,
        .button.subtle:hover,
        .preset-button:hover,
        .row-button:hover,
        .timeline-row:hover,
        .panel-toggle:hover,
        .analytics-filter-trigger:hover,
        .analytics-date-trigger:hover {
          background: var(--surface-soft);
          border-color: var(--line-strong);
          color: var(--ink);
          transform: translateY(-1px);
        }
      }

      .results-pane {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 0;
      }

      .results-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
      }

      .count {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
      }

      .result-list {
        min-height: 0;
        overflow: auto;
      }

      .row-button {
        display: grid;
        width: 100%;
        gap: 6px;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        padding: 11px 12px;
        text-align: left;
      }

      .row-button.is-selected {
        background: var(--accent-soft);
        box-shadow: inset 3px 0 0 var(--accent);
      }

      .timeline-row.is-selected {
        background: var(--accent-soft);
        box-shadow: inset 3px 0 0 var(--accent);
      }

      .row-title {
        overflow: hidden;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 720;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 5px 9px;
        color: var(--muted);
        font-size: 11px;
      }

      .stage-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .stage-title {
        min-width: 0;
      }

      .stage-title strong {
        display: block;
        overflow: hidden;
        font-family: var(--mono);
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stage-title span {
        display: block;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .player-wrap {
        min-height: 0;
        min-width: 0;
        width: 100%;
        max-width: 100%;
        overflow: auto;
      }

      #player {
        position: relative;
        min-height: 0;
        min-width: 0;
        width: 100%;
        max-width: 100%;
      }

      #player .rr-player {
        background: var(--surface) !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
      }

      #player .rr-player__frame,
      #player .replayer-wrapper {
        border-radius: 0 !important;
        box-shadow: none !important;
      }

      .empty,
      .error {
        display: grid;
        place-content: center;
        min-height: 320px;
        gap: 8px;
        color: var(--muted);
        text-align: center;
      }

      .empty strong,
      .error strong {
        color: var(--ink);
        font-size: 14px;
      }

      .error strong {
        color: var(--danger);
      }

      .chart-overview {
        display: grid;
        grid-template-rows: auto auto minmax(286px, 0.85fr) auto;
        gap: 0;
        min-height: 100%;
        width: calc(100% + 2px);
        max-width: none;
        margin-inline: -1px;
        overflow: auto;
      }

      .analytics-control-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-width: 0;
        gap: 12px;
        min-height: 44px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        padding: 7px 12px;
      }

      .analytics-control-left,
      .analytics-control-right,
      .analytics-active-filters {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 6px;
      }

      .analytics-control-left {
        flex: 1 1 auto;
        flex-wrap: wrap;
      }

      .analytics-control-right {
        flex: 0 0 auto;
        margin-left: auto;
      }

      .analytics-active-filters {
        flex-wrap: wrap;
      }

      .analytics-filter-menu,
      .analytics-date-menu {
        position: relative;
        flex: 0 0 auto;
      }

      .analytics-filter-menu summary,
      .analytics-date-menu summary {
        list-style: none;
      }

      .analytics-filter-menu summary::-webkit-details-marker,
      .analytics-date-menu summary::-webkit-details-marker {
        display: none;
      }

      .analytics-filter-trigger,
      .analytics-date-trigger {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 30px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--muted);
        transition:
          color 140ms ease,
          transform 140ms ease;
      }

      .analytics-filter-trigger {
        width: 30px;
      }

      .analytics-filter-trigger svg {
        display: block;
        width: 18px;
        height: 18px;
        stroke-width: 1.9;
      }

      .analytics-date-trigger {
        gap: 8px;
        min-width: 0;
        padding: 0;
        color: var(--ink);
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 720;
      }

      .analytics-date-trigger svg {
        display: block;
        width: 13px;
        height: 13px;
        color: var(--muted);
        stroke-width: 2;
      }

      .analytics-filter-menu[open] .analytics-filter-trigger,
      .analytics-date-menu[open] .analytics-date-trigger {
        color: var(--ink);
      }

      .analytics-filter-popover,
      .analytics-date-popover {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 50;
        display: grid;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        box-shadow: 0 14px 34px rgba(16, 24, 40, 0.14);
        padding: 10px;
      }

      .analytics-filter-popover {
        width: 286px;
        right: auto;
        left: 0;
      }

      .analytics-date-popover {
        width: 360px;
      }

      .analytics-filter-popover label {
        display: grid;
        gap: 5px;
      }

      .analytics-filter-popover input,
      .analytics-filter-popover select,
      .analytics-date-popover input,
      .analytics-date-popover select,
      .analytics-grain-select {
        height: 30px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        outline: none;
        padding: 0 8px;
      }

      .analytics-filter-popover input,
      .analytics-filter-popover select,
      .analytics-date-popover input,
      .analytics-date-popover select {
        width: 100%;
      }

      .analytics-date-presets {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .analytics-date-option {
        justify-content: flex-start;
        width: 100%;
        height: 30px;
        text-align: left;
      }

      .analytics-custom-range {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }

      .analytics-custom-range label {
        display: grid;
        gap: 5px;
      }

      .analytics-date-actions {
        display: flex;
        justify-content: flex-end;
      }

      .analytics-grain-select {
        width: 100%;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        border-bottom: 1px solid var(--line);
      }

      .metric-card {
        display: grid;
        gap: 2px;
        min-width: 0;
        min-height: 58px;
        appearance: none;
        border: 0;
        border-right: 1px solid var(--line);
        background: transparent;
        color: inherit;
        font: inherit;
        padding: 9px 12px;
        text-align: left;
      }

      .metric-card.is-selectable {
        cursor: pointer;
      }

      .metric-card.is-skeleton {
        cursor: default;
        pointer-events: none;
      }

      .metric-card.is-selected {
        background: var(--surface-soft);
        box-shadow: inset 0 -2px 0 var(--accent);
      }

      .metric-card:last-child {
        border-right: 0;
      }

      .metric-card:focus-visible,
      .breakdown-row:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .metric-card span,
      .chart-meta,
      .chart-legend {
        color: var(--muted);
        font-size: 11px;
      }

      .metric-card strong {
        overflow: hidden;
        font-family: var(--mono);
        font-size: 16px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .metric-card code,
      .chart-meta code {
        display: block;
        overflow: hidden;
        max-width: 100%;
        color: var(--faint);
        font-family: var(--mono);
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chart-panel {
        display: grid;
        position: relative;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 0;
        min-width: 0;
        overflow: hidden;
      }

      .chart-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: nowrap;
        gap: 12px;
        padding: 9px 12px 4px;
      }

      .chart-panel-head .label {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chart-panel-head .chart-meta {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-align: right;
      }

      .chart-panel-head .chart-legend {
        flex: 0 1 auto;
        justify-content: flex-end;
        min-width: 0;
      }

      .chart-canvas {
        position: relative;
        min-height: 230px;
        padding: 2px 12px 10px;
      }

      .chart-svg {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 220px;
      }

      .chart-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 7px 12px;
      }

      .legend-key {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .legend-swatch {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--accent);
      }

      .breakdown-grid {
        display: grid;
        grid-auto-flow: dense;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        background: var(--surface);
        overflow: hidden;
        padding: 1px 0 0 1px;
      }

      .breakdown-list {
        display: grid;
        align-content: start;
        gap: 0;
        padding: 4px 0 0;
      }

      .skeleton-line,
      .skeleton-row::before,
      .skeleton-row::after {
        display: block;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--surface-soft), #f8fafb, var(--surface-soft));
        background-size: 220% 100%;
        animation: skeleton-pulse 1.1s ease-in-out infinite;
        content: "";
      }

      .skeleton-line {
        height: 10px;
      }

      .skeleton-line.short {
        width: 44%;
      }

      .skeleton-line.medium {
        width: 68%;
      }

      .skeleton-line.long {
        width: 86%;
      }

      .skeleton-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 42px;
        gap: 12px;
        align-items: center;
        min-height: 28px;
        padding: 6px 12px;
      }

      .skeleton-row::before {
        width: var(--skeleton-width, 74%);
        height: 11px;
      }

      .skeleton-row::after {
        width: 34px;
        height: 11px;
        justify-self: end;
      }

      @keyframes skeleton-pulse {
        to {
          background-position: -220% 0;
        }
      }

      .breakdown-grid .chart-panel {
        box-sizing: border-box;
        border: 1px solid var(--line);
        background: var(--surface);
        margin: -1px 0 0 -1px;
        overflow: hidden;
      }

      .breakdown-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        position: relative;
        width: 100%;
        appearance: none;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        overflow: hidden;
        padding: 4px 12px;
        text-align: left;
      }

      .breakdown-row:hover {
        background: #eef2ff;
      }

      .breakdown-row.is-selected {
        background: rgb(15 23 42 / 8%);
      }

      .breakdown-row.is-other {
        cursor: default;
        color: var(--muted);
      }

      .breakdown-row.is-other:hover {
        background: transparent;
      }

      .breakdown-row::before {
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--bar-width, 0%);
        background: rgba(107, 124, 255, 0.12);
        content: "";
      }

      .breakdown-label {
        position: relative;
        z-index: 1;
        overflow: hidden;
        min-width: 0;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .breakdown-value {
        position: relative;
        z-index: 1;
        min-width: max-content;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 650;
        text-align: right;
      }

      .facts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-bottom: 1px solid var(--line);
      }

      .fact {
        display: grid;
        gap: 3px;
        min-width: 0;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
      }

      .fact:nth-child(2n) {
        border-right: 0;
      }

      .fact:nth-last-child(-n + 2) {
        border-bottom: 0;
      }

      .fact span {
        color: var(--muted);
        font-size: 11px;
        font-weight: 680;
      }

      .fact strong {
        overflow: hidden;
        font-family: var(--mono);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .timeline {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 0;
      }

      .timeline-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
      }

      .timeline-list {
        overflow: auto;
      }

      .timeline-row {
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr);
        gap: 10px;
        width: 100%;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        padding: 9px 12px;
        text-align: left;
      }

      .context-row {
        grid-template-columns: 78px minmax(0, 1fr);
        cursor: default;
      }

      @media (hover: hover) {
        .context-row:hover {
          background: transparent;
          border-color: var(--line);
          color: var(--ink);
          transform: none;
        }
      }

      .timeline-time {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .timeline-main {
        min-width: 0;
      }

      .timeline-main strong,
      .timeline-main span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .timeline-main strong {
        font-size: 12px;
      }

      .timeline-main span {
        color: var(--muted);
        font-size: 11px;
      }

      .debug {
        display: none;
        border-top: 1px solid var(--line);
      }

      .debug.is-open {
        display: block;
      }

      .debug pre {
        max-height: 220px;
        overflow: auto;
        margin: 0;
        padding: 12px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .is-hidden {
        display: none !important;
      }

      @media (max-width: 1180px) {
        body {
          overflow: auto;
        }

        .app {
          --rail-track: 340px;
          --inspector-track: minmax(0, 1fr);
          grid-template-columns: var(--rail-track) minmax(0, 1fr);
          height: auto;
          min-height: 100vh;
        }

        .app.rail-collapsed {
          --rail-track: 0px;
        }

        .app.analytics-mode {
          --rail-track: 0px;
        }

        .app.inspector-collapsed {
          --inspector-track: minmax(0, 1fr);
        }

        .inspector {
          grid-column: 1 / -1;
          min-height: 520px;
          border-top: 1px solid var(--line);
        }

        .app.inspector-collapsed .inspector {
          min-height: 0;
          border-top: 0;
        }
      }

      @media (max-width: 760px) {
        .app {
          --rail-track: 1fr;
          grid-template-columns: 1fr;
        }

        .app.rail-collapsed,
        .app.inspector-collapsed {
          grid-template-columns: 1fr;
        }

        .rail,
        .stage {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .app.analytics-mode {
          --analytics-nav-width: 100vw;
        }

        .app.analytics-mode .rail {
          width: 100vw;
          border-right: 0;
        }

        .app.analytics-mode .stage-head {
          height: auto;
          padding: 64px 16px 8px;
        }

        .filters {
          grid-template-columns: 1fr;
        }

        .date-inputs {
          grid-template-columns: 1fr;
        }

        .stage-head {
          align-items: stretch;
          flex-direction: column;
        }

        .stage-head .actions {
          display: flex;
          width: 100%;
        }

        .analytics-control-bar,
        .analytics-control-right {
          align-items: flex-start;
          flex-direction: column;
        }

        .analytics-control-right {
          margin-left: 0;
        }

        .metric-grid,
        .breakdown-grid {
          grid-template-columns: 1fr;
        }

      }
    </style>
  </head>
  <body>
    <main class="app" id="app">
      <aside class="rail" id="rail">
        <div class="rail-content" id="railContent">
          <header class="topbar">
            <div class="topbar-primary">
              <span class="brand-mark" aria-label="Hogflare" role="img">
                <svg viewBox="0 0 733 868" aria-hidden="true" focusable="false">

                    fill="currentColor"

                <button class="section-button" id="analyticsSection" type="button" aria-selected="true">

                </button>
                <button class="section-button" id="replaySection" type="button" aria-selected="false">
                  Replays
                </button>
              </nav>
            </div>
            <span class="status" id="status" hidden>idle</span>
          </header>

          <section class="rail-body">
          <form class="filters" id="filters">
            <div class="date-range" role="group" aria-labelledby="dateRangeLabel">
              <span class="label date-range-label" id="dateRangeLabel">Date range</span>
              <div class="date-presets" aria-label="Date range presets">
                <button class="preset-button" type="button" data-date-preset="today" aria-pressed="false">Today</button>
                <button class="preset-button" type="button" data-date-preset="24h" aria-pressed="false">Last 24h</button>
                <button class="preset-button" type="button" data-date-preset="72h" aria-pressed="false">Last 72h</button>
                <button class="preset-button" type="button" data-date-preset="7d" aria-pressed="false">Last 7d</button>
                <button class="preset-button" type="button" data-date-preset="14d" aria-pressed="false">Last 14d</button>
                <button class="preset-button" type="button" data-date-preset="30d" aria-pressed="true">Last 30d</button>
                <button class="preset-button" type="button" data-date-preset="quarter" aria-pressed="false">Quarter</button>
                <button class="preset-button" type="button" data-date-preset="year" aria-pressed="false">Year</button>
                <button class="preset-button" type="button" data-date-preset="2y" aria-pressed="false">2y</button>
                <button class="preset-button" type="button" data-date-preset="5y" aria-pressed="false">5y</button>
                <button class="preset-button" type="button" data-date-preset="max" aria-pressed="false">Max</button>
              </div>
              <div class="date-inputs">
                <label class="date-field" for="dateFrom">
                  <span>From</span>
                  <input id="dateFrom" name="date_from" type="datetime-local" autocomplete="off" step="60" />
                </label>
                <label class="date-field" for="dateTo">
                  <span>To</span>
                  <input id="dateTo" name="date_to" type="datetime-local" autocomplete="off" step="60" />
                </label>
              </div>
              <div class="field wide" data-section="analytics">
                <label class="label" for="granularity">Date grain</label>
                <select id="granularity" name="granularity">
                  <option value="hour">Hour</option>
                  <option value="day" selected>Day</option>
                  <option value="week">Week</option>
                  <option value="month">Month</option>
                </select>
              </div>
            </div>
            <div class="field" data-section="replays">
              <label class="label" for="distinctId">Distinct ID</label>
              <input id="distinctId" name="distinct_id" autocomplete="off" placeholder="user_123" />
            </div>
            <div class="field" data-section="replays">
              <label class="label" for="sessionId">Session ID</label>
              <input id="sessionId" name="session_id" autocomplete="off" placeholder="$session_id" />
            </div>
            <div class="field wide">
              <label class="label" for="url">URL contains</label>
              <input id="url" name="url" autocomplete="off" placeholder="/checkout" />
            </div>
            <div class="field wide">
              <label class="label" for="eventName">Event name</label>
              <input id="eventName" name="event_name" autocomplete="off" placeholder="Product Viewed" />
            </div>
            <div class="section-controls" data-section="analytics">
              <div class="analytics-query-grid">
                <div class="field wide">
                  <label class="label" for="metric">Metric</label>
                  <select id="metric" name="metric">
                    <optgroup label="Events">
                      <option value="events.event_count">Events</option>
                      <option value="events.unique_users">Users</option>
                    </optgroup>
                    <optgroup label="Pageviews">
                      <option value="pageviews.pageviews">Pageviews</option>
                    </optgroup>
                    <optgroup label="Sessions">
                      <option value="sessions.session_count">SDK sessions</option>
                      <option value="sessions.average_session_seconds">Avg session</option>
                    </optgroup>
                  </select>
                </div>
                <input id="dimension" type="hidden" value="events.event_type" />
              </div>
              <input id="semanticFilters" name="semantic_filters" type="hidden" />
              <div class="semantic-filter-block is-hidden" id="semanticFilterBlock">
                <span class="label">Active filters</span>
                <div
                  class="semantic-filter-strip"
                  id="semanticFilterStrip"
                  data-testid="analytics-filter-pills"
                  aria-label="Active analytics filters"
                ></div>
              </div>
            </div>
            <div class="field" data-section="replays">
              <label class="label" for="minDuration">Min duration</label>
              <input id="minDuration" name="min_duration_secs" inputmode="numeric" placeholder="sec" />
            </div>
            <div class="field" data-section="replays">
              <label class="label" for="maxDuration">Max duration</label>
              <input id="maxDuration" name="max_duration_secs" inputmode="numeric" placeholder="sec" />
            </div>
            <div class="field" data-section="replays">
              <label class="label" for="minEvents">Min events</label>
              <input id="minEvents" name="min_events" inputmode="numeric" placeholder="count" />
            </div>
            <div class="field" data-section="replays">
              <label class="label" for="maxEvents">Max events</label>
              <input id="maxEvents" name="max_events" inputmode="numeric" placeholder="count" />
            </div>
            <div class="field wide" data-section="replays">
              <label class="label" for="limit">Limit</label>
              <input id="limit" name="limit" inputmode="numeric" value="100" />
            </div>
            <div class="actions">
              <button class="button" id="submitButton" type="submit" data-section="replays">Search</button>
              <button class="button secondary" id="clear" type="button" data-section="replays">Clear</button>
            </div>
          </form>

          <section class="result-controls" id="resultControls" aria-label="Replay result controls">
            <nav class="mode-switch" aria-label="Replay result type">
              <button class="mode-button" id="sessionMode" type="button" aria-selected="true">
                Sessions
              </button>
              <button class="mode-button" id="eventMode" type="button" aria-selected="false">
                Events
              </button>
              <button class="mode-button" id="funnelMode" type="button" aria-selected="false">
                Funnel
              </button>
              <button class="mode-button" id="frictionMode" type="button" aria-selected="false">
                Friction
              </button>
              <button class="mode-button" id="personMode" type="button" aria-selected="false">
                Person
              </button>
            </nav>
            <div class="mode-options" id="modeOptions">
              <div class="mode-panel mode-field" data-modes="funnels">
                <input id="steps" name="steps" form="filters" type="hidden" />

                <div class="select-row" id="funnelStepControls">
                  <label class="select-field">
                    <span class="label">Step 1</span>
                    <select data-step-index="0" aria-label="Funnel step 1"></select>

                  <label class="select-field">
                    <span class="label">Step 2</span>
                    <select data-step-index="1" aria-label="Funnel step 2"></select>
                  </label>
                  <label class="select-field">
                    <span class="label">Step 3</span>
                    <select data-step-index="2" aria-label="Funnel step 3"></select>

                <div class="chip-row" id="signalChoices">
                  <button class="chip-button is-selected" type="button" data-signal="">Any</button>
                  <button class="chip-button" type="button" data-signal="rage_click">Rage clicks</button>
                  <button class="chip-button" type="button" data-signal="dead_click">Dead clicks</button>
                  <button class="chip-button" type="button" data-signal="repeated_navigation">Navigation</button>
                  <button class="chip-button" type="button" data-signal="long_idle">Idle</button>
                  <button class="chip-button" type="button" data-signal="form_thrash">Form thrash</button>
                  <button class="chip-button" type="button" data-signal="missed_cta">Missed CTA</button>
                </div>
              </div>
            </div>
          </section>

          <div class="results-pane" id="resultsPane">
            <div class="results-head">
              <span class="label" id="resultsLabel">Recent sessions</span>
              <span class="count" id="resultCount">0</span>
            </div>
            <div class="result-list" id="results"></div>
          </div>
          </section>
        </div>
        <div class="panel-dock rail-dock">
          <button
            class="panel-toggle"
            id="toggleRail"
            type="button"
            aria-controls="railContent"
            aria-expanded="true"
            aria-label="Hide filters"
            aria-pressed="false"
            data-state="expanded"
            title="Hide filters"
          >
            <span class="sr-only">Toggle filters</span>
            <svg
              class="panel-icon-expanded"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="4" y="5" width="16" height="14" rx="2" />
              <path d="M9 5v14" />
              <path d="m15 9-3 3 3 3" />
            </svg>

      const funnelEventOptions = [

        { key: "today", label: "Today", shortLabel: "Today" },

        { key: "quarter", label: "Past quarter", shortLabel: "Quarter" },
        { key: "year", label: "Past year", shortLabel: "1y" },
        { key: "2y", label: "Past 2 years", shortLabel: "2y" },

      function paramsFromForm(options = {}) {
        const params = new URLSearchParams();
        const data = new FormData(els.filters);
        const mode = options.mode || state.mode;
        const skip = skippedFields(mode);
        for (const [key, value] of data.entries()) {
          const trimmed = String(value).trim();
          if (!trimmed) continue;
          if (skip.has(key)) continue;
          params.set(key, valueForQuery(key, trimmed));
        }
        return params;
      }

      function valueForQuery(key, value) {
        if (key === "date_from" || key === "date_to") return dateInputToIso(value);
        return value;
      }

      function dateInputToIso(value) {
        const date = new Date(value);
        if (!Number.isFinite(date.getTime())) return value;
        return date.toISOString();
      }

      function skippedFields(mode) {
        const durationFields = ["min_duration_secs", "max_duration_secs", "min_events", "max_events"];
        const replayIdentityFields = ["distinct_id", "session_id"];
        const analyticsFields = ["metric", "dimension", "granularity", "semantic_filters"];
        const byMode = {
          overview: [...durationFields, ...replayIdentityFields, "limit", "steps", "signal"],
          sessions: [...analyticsFields, "steps", "signal"],
          events: [...analyticsFields, ...durationFields, "steps", "signal"],
          funnels: [...analyticsFields, ...durationFields, "event_name", "signal"],
          friction: [...analyticsFields, "event_name", "steps"],
          person: [...analyticsFields, ...durationFields, "steps", "signal"],
          sessionLoad: [
            ...analyticsFields,
            "session_id",
            "url",
            "event_name",
            "steps",
            "signal",
            ...durationFields,
          ],
        };
        return new Set(byMode[mode] || []);
      }

      function setField(name, value) {
        const input = els.filters.elements.namedItem(name);
        if (!input || !value) return;
        input.value = input.type === "datetime-local" ? isoToDateInput(value) : value;
      }

      function isoToDateInput(value) {
        const date = new Date(value);
        if (!Number.isFinite(date.getTime())) return value;
        return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}T${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
      }

      function pad2(value) {
        return String(value).padStart(2, "0");
      }

      function setDateRange(from, to) {
        els.dateFrom.value = from ? isoToDateInput(from) : "";
        els.dateTo.value = to ? isoToDateInput(to) : "";
      }

      function dateFromInput(value) {
        const date = new Date(value);
        return Number.isFinite(date.getTime()) ? date : null;
      }

      function applyDatePreset(preset) {
        if (preset === "max") {
          setDateRange(null, null);
          setGranularityForDatePreset(preset);
          setDatePresetState("max");
          requestSearchForCurrentMode();
          return;
        }
        const to = new Date();
        const from = new Date(to);
        if (preset === "today") {
          from.setHours(0, 0, 0, 0);
        } else if (preset === "24h") {
          from.setDate(from.getDate() - 1);
        } else if (preset === "72h") {
          from.setDate(from.getDate() - 3);
        } else if (preset === "7d") {
          from.setDate(from.getDate() - 7);
        } else if (preset === "14d") {
          from.setDate(from.getDate() - 14);
        } else if (preset === "30d") {
          from.setDate(from.getDate() - 30);
        } else if (preset === "quarter") {
          from.setDate(from.getDate() - 90);
        } else if (preset === "year") {
          from.setFullYear(from.getFullYear() - 1);
        } else if (preset === "2y") {
          from.setFullYear(from.getFullYear() - 2);
        } else if (preset === "5y") {
          from.setFullYear(from.getFullYear() - 5);
        } else {
          return;
        }
        setDateRange(from, to);
        setGranularityForDatePreset(preset);
        setDatePresetState(preset);
        requestSearchForCurrentMode();
      }

      function setDatePresetState(preset) {
        for (const button of document.querySelectorAll("[data-date-preset]")) {
          const selected = button.dataset.datePreset === preset;
          button.classList.toggle("is-selected", selected);
          button.setAttribute("aria-pressed", selected ? "true" : "false");
        }
      }

      function setGranularityForDatePreset(preset) {
        if (state.mode !== "overview") return;
        if (preset === "today" || preset === "24h" || preset === "72h") {
          els.granularity.value = "hour";
        } else if (preset === "7d" || preset === "14d" || preset === "30d") {
          els.granularity.value = "day";
        } else if (preset === "quarter" || preset === "year") {
          els.granularity.value = "week";
        } else if (preset === "2y" || preset === "5y" || preset === "max") {
          els.granularity.value = "month";
        }
      }

      function ensureDefaultAnalyticsDateRange() {
        if (els.dateFrom.value || els.dateTo.value) {
          syncDatePresetFromInputs();
          return;
        }
        const to = new Date();
        const from = new Date(to);
        from.setDate(from.getDate() - 30);
        setDateRange(from, to);
        setGranularityForDatePreset(defaultAnalyticsDatePreset);
        setDatePresetState(defaultAnalyticsDatePreset);
      }

      function syncDatePresetFromInputs() {
        const from = dateFromInput(els.dateFrom.value);
        const to = dateFromInput(els.dateTo.value);
        if (!from || !to) {
          setDatePresetState(!from && !to ? "max" : "");
          return;
        }
        const minute = 60 * 1000;
        const tolerance = 5 * minute;
        const elapsed = to.getTime() - from.getTime();
        const startOfDay = new Date(to);
        startOfDay.setHours(0, 0, 0, 0);
        if (Math.abs(from.getTime() - startOfDay.getTime()) <= tolerance) {
          setDatePresetState("today");
        } else if (Math.abs(elapsed - 24 * 60 * minute) <= tolerance) {
          setDatePresetState("24h");
        } else if (Math.abs(elapsed - 72 * 60 * minute) <= tolerance) {
          setDatePresetState("72h");
        } else if (Math.abs(elapsed - 7 * 24 * 60 * minute) <= tolerance) {
          setDatePresetState("7d");
        } else if (Math.abs(elapsed - 14 * 24 * 60 * minute) <= tolerance) {
          setDatePresetState("14d");
        } else if (Math.abs(elapsed - 30 * 24 * 60 * minute) <= tolerance) {
          setDatePresetState("30d");
        } else if (Math.abs(elapsed - 90 * 24 * 60 * minute) <= tolerance) {
          setDatePresetState("quarter");
        } else if (Math.abs(elapsed - 365 * 24 * 60 * minute) <= 2 * 24 * 60 * minute) {
          setDatePresetState("year");
        } else if (Math.abs(elapsed - 2 * 365 * 24 * 60 * minute) <= 4 * 24 * 60 * minute) {
          setDatePresetState("2y");
        } else if (Math.abs(elapsed - 5 * 365 * 24 * 60 * minute) <= 10 * 24 * 60 * minute) {
          setDatePresetState("5y");
        } else {
          setDatePresetState("");
        }
      }

      function setStatus(text, ok = false, loading = false) {
        els.status.hidden = false;
        els.status.removeAttribute("hidden");

        state.analyticsLoading = loading;

      function initModeControls() {
        const selects = els.funnelStepControls.querySelectorAll("select");
        for (const select of selects) {
          select.innerHTML = "";
          for (const optionValue of funnelEventOptions) {
            const option = document.createElement("option");
            option.value = optionValue;
            option.textContent = optionValue || "None";
            select.appendChild(option);
          }
          select.value = defaultFunnelSteps[Number(select.dataset.stepIndex)] || "";
          select.addEventListener("change", () => {
            updateStepsFromControls();
            if (state.mode === "funnels") runSearch();
          });
        }
        updateStepsFromControls();

        for (const button of els.signalChoices.querySelectorAll("[data-signal]")) {
          button.addEventListener("click", () => setSignal(button.dataset.signal || "", { search: true }));
        }
        setSignal("");
      }

      function initAnalyticsControls() {
        for (const select of [els.metric, els.granularity]) {
          select.addEventListener("change", () => {
            if (select === els.metric) syncAnalyticsDimensions();
            if (state.mode === "overview") {
              if (select === els.granularity) {
                requestAnalyticsSearch({ panels: ["series"] });
              } else if (select === els.metric) {
                requestAnalyticsSearch({ panels: analyticsPanelsForCurrentQuery() });
              } else {
                requestAnalyticsSearch({ panels: analyticsFocusPanels() });
              }
            }
          });
        }
        syncAnalyticsDimensions();
        renderSemanticFilters();

      function syncAnalyticsDimensions() {
        const model = analyticsMetricModels[els.metric.value] || "events";
        els.dimension.value = analyticsDefaultDimensions[model] || "events.event_type";
      }

      function semanticFilters() {
        try {
          const parsed = JSON.parse(els.semanticFilters.value || "{}");
          return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
        } catch (_) {
          return {};
        }
      }

      function writeSemanticFilters(filters) {
        const normalized = {};
        for (const [dimension, values] of Object.entries(filters || {})) {
          const cleanValues = [...new Set((Array.isArray(values) ? values : [values]).map(normalizeFilterValue).filter(Boolean))];
          if (cleanValues.length) normalized[dimension] = cleanValues;
        }
        els.semanticFilters.value = Object.keys(normalized).length ? JSON.stringify(normalized) : "";
        renderSemanticFilters();
      }

      function normalizeFilterValue(value) {
        return String(value ?? "").trim();
      }

      function toggleSemanticFilter(dimension, value) {
        const normalizedValue = normalizeFilterValue(value);
        if (!dimension || !normalizedValue) return;
        const filters = semanticFilters();
        const selected = new Set((filters[dimension] || []).map(normalizeFilterValue));
        if (selected.has(normalizedValue)) selected.delete(normalizedValue);
        else selected.add(normalizedValue);
        if (selected.size) filters[dimension] = [...selected];
        else delete filters[dimension];
        writeSemanticFilters(filters);
        if (state.mode === "overview") requestAnalyticsSearch();
      }

      function removeSemanticFilter(dimension, value) {
        const normalizedValue = normalizeFilterValue(value);
        const filters = semanticFilters();
        const values = (filters[dimension] || []).map(normalizeFilterValue).filter((item) => item !== normalizedValue);
        if (values.length) filters[dimension] = values;
        else delete filters[dimension];
        writeSemanticFilters(filters);
        if (state.mode === "overview") requestAnalyticsSearch();
      }

      function isSemanticFilterSelected(dimension, value) {
        const normalizedValue = normalizeFilterValue(value);
        return (semanticFilters()[dimension] || []).map(normalizeFilterValue).includes(normalizedValue);
      }

      function renderSemanticFilters() {
        const filters = semanticFilters();
        els.semanticFilterStrip.innerHTML = "";
        const entries = Object.entries(filters).flatMap(([dimension, values]) =>
          (values || []).map((value) => ({ dimension, value: normalizeFilterValue(value) })).filter((item) => item.value),
        );
        els.semanticFilterBlock.classList.toggle("is-hidden", !entries.length);
        for (const item of entries) {
          const pill = document.createElement("span");
          pill.className = "semantic-filter-pill";
          pill.dataset.dimension = item.dimension;
          pill.dataset.value = item.value;
          const label = document.createElement("span");
          label.textContent = `${semanticFilterLabel(item.dimension)}: ${item.value}`;
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "×";
          button.setAttribute("aria-label", `Remove ${item.value}`);
          button.addEventListener("click", () => removeSemanticFilter(item.dimension, item.value));
          pill.append(label, button);
          els.semanticFilterStrip.appendChild(pill);
        }
      }

      function semanticFilterLabel(dimension) {
        return analyticsDimensionMeta[dimension]?.label || dimension;
      }

      function updateStepsFromControls() {
        const steps = Array.from(els.funnelStepControls.querySelectorAll("select"))
          .map((select) => select.value)
          .filter(Boolean);
        document.getElementById("steps").value = steps.join(",");
      }

      function setFunnelSteps(value) {
        const steps = String(value || "")
          .split(",")
          .map((step) => step.trim())
          .filter(Boolean);
        const selects = els.funnelStepControls.querySelectorAll("select");
        for (const select of selects) {
          const index = Number(select.dataset.stepIndex);
          const value = steps[index] ?? defaultFunnelSteps[index] ?? "";
          if (![...select.options].some((option) => option.value === value)) {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            select.appendChild(option);
          }
          select.value = value;
        }
        updateStepsFromControls();
      }

      function setSignal(value, options = {}) {
        const normalized = value || "";
        document.getElementById("signal").value = normalized;
        for (const button of els.signalChoices.querySelectorAll("[data-signal]")) {
          button.classList.toggle("is-selected", (button.dataset.signal || "") === normalized);
        }
        if (options.search && state.mode === "friction") runSearch();
      }

      function setMode(mode) {
        if (mode !== "overview") cancelAnalyticsRequests();
        state.mode = mode;
        state.section = mode === "overview" ? "analytics" : "replays";
        if (state.section === "replays") state.lastReplayMode = mode;
        syncSectionControls();
        syncInspectorVisibility();
        renderSemanticFilters();
        for (const [key, button] of [
          ["sessions", els.sessionMode],
          ["events", els.eventMode],
          ["funnels", els.funnelMode],
          ["friction", els.frictionMode],
          ["person", els.personMode],
        ]) {
          button.setAttribute("aria-selected", mode === key ? "true" : "false");
        }
        els.submitButton.textContent = "Search";
        els.resultsLabel.textContent = modes[mode].label;
        els.resultControls.classList.toggle("is-hidden", state.section === "analytics");
        let hasModeOptions = false;
        for (const field of document.querySelectorAll(".mode-field")) {
          const enabled = field.dataset.modes.split(" ").includes(mode);
          field.classList.toggle("is-hidden", !enabled);
          hasModeOptions ||= enabled;
        }
        els.modeOptions.classList.toggle("is-hidden", !hasModeOptions);
        renderResults();
      }

      function syncSectionControls() {
        const analyticsSelected = state.mode === "overview";
        state.section = analyticsSelected ? "analytics" : "replays";
        els.app.classList.toggle("analytics-mode", analyticsSelected);
        els.replaySection.setAttribute("aria-selected", analyticsSelected ? "false" : "true");
        els.analyticsSection.setAttribute("aria-selected", analyticsSelected ? "true" : "false");
        els.resultsPane.classList.toggle("is-hidden", analyticsSelected);
        for (const field of document.querySelectorAll("[data-section]")) {
          field.classList.toggle("is-hidden", field.dataset.section !== state.section);
        }
        window.requestAnimationFrame(schedulePlayerResize);
        window.requestAnimationFrame(scheduleChartResize);
      }

      function formatTime(value) {
        if (!value) return "-";
        return new Intl.DateTimeFormat(undefined, {
          month: "short",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        }).format(new Date(value));
      }

      function formatDurationMs(ms) {
        if (!Number.isFinite(ms)) return "-";
        if (ms < 1000) return `${Math.max(0, ms)}ms`;
        const seconds = Math.round(ms / 1000);
        if (seconds < 60) return `${seconds}s`;
        const minutes = Math.floor(seconds / 60);
        return `${minutes}m ${seconds % 60}s`;
      }

      function formatOffset(ms) {
        const safe = Math.max(0, Math.round(ms || 0));
        const seconds = Math.floor(safe / 1000);
        return `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
      }

      function showMessage(kind, title, body) {
        destroyPlayer();
        state.playerEvents = [];
        state.playerAnchorMs = 0;
        state.playerWidth = 0;
        state.playerHeight = 0;
        els.player.style.minHeight = "";
        els.player.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = kind === "error" ? "error" : "empty";
        const strong = document.createElement("strong");
        strong.textContent = title;
        const span = document.createElement("span");
        span.textContent = body;
        wrap.append(strong, span);
        els.player.appendChild(wrap);
      }

      function renderResults() {
        els.results.innerHTML = "";
        if (state.mode === "overview") {
          els.resultCount.textContent = "0";
          return;
        }
        const items = resultItems();
        els.resultCount.textContent = String(items.length);
        for (const item of items) {
          els.results.appendChild(resultRow(item));
        }
      }

      function resultItems() {
        if (state.mode === "events") return state.events;
        if (state.mode === "funnels") return state.funnels;
        if (state.mode === "friction") return state.friction;
        if (state.mode === "person") return state.person?.timeline || [];
        return state.sessions;
      }

      function resultRow(item) {
        if (state.mode === "overview") return chartMetricRow(item);
        if (state.mode === "events") return eventRow(item);
        if (state.mode === "funnels") return funnelRow(item);
        if (state.mode === "friction") return frictionRow(item);
        if (state.mode === "person") return personRow(item);
        return sessionRow(item);
      }

      function chartMetricRow(metric) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "row-button";
        row.addEventListener("click", () => renderChartContext(metric));

        const title = document.createElement("div");
        title.className = "row-title";
        title.textContent = metric.label;

        const meta = document.createElement("div");
        meta.className = "row-meta";
        meta.append(textNode(metric.display_value), textNode(metric.semantic_ref));

        row.append(title, meta);
        return row;
      }

      function sessionRow(session) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "row-button";
        row.classList.toggle("is-selected", state.selectedSession?.session_id === session.session_id);
        row.addEventListener("click", () => loadSession(session.session_id, 0));

        const title = document.createElement("div");
        title.className = "row-title";
        title.textContent = session.session_id;

        const meta = document.createElement("div");
        meta.className = "row-meta";
        meta.append(
          textNode(session.distinct_id),
          textNode(`${session.event_count} events`),
          textNode(formatDurationMs(session.duration_ms)),
          textNode(session.first_url || "no url"),
        );

        row.append(title, meta);
        return row;
      }

      function eventRow(event) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "row-button";
        row.classList.toggle("is-selected", state.selectedEvent?.uuid === event.uuid);
        row.addEventListener("click", () => selectEvent(event));

        const title = document.createElement("div");
        title.className = "row-title";
        title.textContent = event.event;

        const meta = document.createElement("div");
        meta.className = "row-meta";
        meta.append(
          textNode(event.distinct_id),
          textNode(event.session_id || "no session id"),
          textNode(formatTime(event.created_at)),
        );
        if (event.url) meta.append(textNode(event.url));

        row.append(title, meta);
        return row;
      }

      function funnelRow(session) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "row-button";
        row.classList.toggle("is-selected", state.selectedFunnel === session);
        row.addEventListener("click", () => selectFunnel(session));

        const title = document.createElement("div");
        title.className = "row-title";
        title.textContent = `${session.status} · ${session.current_step || "step"}`;

        const meta = document.createElement("div");
        meta.className = "row-meta";
        meta.append(
          textNode(session.distinct_id),
          textNode(session.session_id || "no session id"),
          textNode(`${session.completed_steps}/${session.step_count}`),
        );
        if (session.drop_off_step) meta.append(textNode(`next ${session.drop_off_step}`));
        if (session.url) meta.append(textNode(session.url));

        row.append(title, meta);
        return row;
      }

      function frictionRow(item) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "row-button";
        row.classList.toggle("is-selected", state.selectedFriction === item);
        row.addEventListener("click", () => selectFriction(item));

        const signal = item.signals[0];
        const title = document.createElement("div");
        title.className = "row-title";
        title.textContent = `${item.score} · ${signal?.label || "Signal"}`;

        const meta = document.createElement("div");
        meta.className = "row-meta";
        meta.append(
          textNode(item.session.distinct_id),
          textNode(item.session.session_id),
          textNode(`${item.signals.length} signals`),
        );
        if (signal?.detail) meta.append(textNode(signal.detail));

        row.append(title, meta);
        return row;
      }

      function personRow(item) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "row-button";
        row.classList.toggle("is-selected", state.selectedPersonItem === item);
        row.addEventListener("click", () => selectPersonItem(item));

        const title = document.createElement("div");
        title.className = "row-title";
        title.textContent = `${item.kind} · ${item.title}`;

        const meta = document.createElement("div");
        meta.className = "row-meta";
        meta.append(textNode(formatTime(item.timestamp)), textNode(item.session_id || "no session id"));
        if (item.url) meta.append(textNode(item.url));
        if (item.detail) meta.append(textNode(item.detail));

        row.append(title, meta);
        return row;
      }

      function textNode(value) {
        const span = document.createElement("span");
        span.textContent = value;
        return span;
      }

      function replaceUrl(path, params) {
        const query = params.toString();
        history.replaceState(null, "", query ? `${path}?${query}` : path);
      }

      function replaceAnalyticsUrlFromForm() {
        const params = paramsFromForm({ mode: "overview" });
        replaceUrl(analyticsPath, params);
        return params;
      }

      function replaceReplayUrlFromForm(mode = state.mode) {
        const params = paramsFromForm({ mode });
        if (mode && mode !== "sessions") params.set("mode", mode);
        replaceUrl(replayPath, params);
        return params;
      }

      function requestSearchForCurrentMode() {
        if (state.mode === "overview") requestAnalyticsSearch();
        else {
          replaceReplayUrlFromForm();
          runSearch();
        }
      }

      function requestAnalyticsSearch(options = {}) {
        if (state.mode !== "overview") {
          runSearch();
          return;
        }
        replaceAnalyticsUrlFromForm();
        runSearch(options);
      }

      async function requestJson(path, params, options = {}) {
        const query = params?.toString();
        const response = await fetch(query ? `${path}?${query}` : path, options);
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || "Request failed.");
        return body;
      }

      function cancelAnalyticsRequests() {
        state.analyticsRequestId += 1;
        state.analyticsPendingPanels.clear();
        setAnalyticsLoading(false);
      }

      async function loadCharts(options = {}) {
        const requestId = ++state.analyticsRequestId;
        const params = paramsFromForm({ mode: "overview" });
        const availablePanels = analyticsPanelsForCurrentQuery();
        const panels = analyticsPanelsForRequest(options.panels, availablePanels);
        state.analyticsPendingPanels = new Set(panels);
        clearStatus();
        setAnalyticsLoading(true);
        try {
          state.mode = "overview";
          syncSectionControls();
          prepareAnalyticsShell(panels);
          clearReplayInspectorContext();
          renderResults();
          renderCharts(state.charts);
          renderChartContext();
          replaceUrl(analyticsPath, params);
          let failures = 0;
          await Promise.all(
            panels.map(async (panel) => {
              const panelParams = new URLSearchParams(params);
              panelParams.set("panel", panel);
              try {
                const body = await requestJson("/analytics/api/charts", panelParams);
                if (requestId !== state.analyticsRequestId) return;
                mergeAnalyticsPanel(panel, body);
              } catch (error) {
                if (error?.name === "AbortError" || requestId !== state.analyticsRequestId) return;
                failures += 1;
              } finally {
                if (requestId === state.analyticsRequestId) {
                  state.analyticsPendingPanels.delete(panel);
                  renderCharts(state.charts);
                  renderChartContext();
                }
              }
            }),
          );
          if (requestId !== state.analyticsRequestId) return;
          if (failures === panels.length) throw new Error("Analytics panels failed to load.");
          if (failures) setStatus(`${failures} analytics panels failed`);
          else clearStatus();
        } finally {
          if (requestId === state.analyticsRequestId) {
            setAnalyticsLoading(false);
            state.analyticsPendingPanels.clear();
            renderAnalyticsFacts(state.charts);
            renderChartContext();
          }
        }
      }

      async function loadSessions(options = {}) {
        setStatus("loading");
        const body = await requestJson("/replay/api/sessions", paramsFromForm({ mode: "sessions" }));
        state.sessions = body.sessions || [];
        if (!options.keepSelection) {
          clearReplayInspectorContext();
        }
        renderResults();
        setStatus(`${state.sessions.length} sessions`, true);
        if (!state.sessions.length) {
          showMessage("empty", "No sessions", "No matching replay chunks were found.");
          renderFacts(null);
          renderActivity([]);
        } else if (!options.silent) {
          showMessage("empty", "Select a session", "Replay rows are ready.");
        }
      }

      async function loadEvents() {
        setStatus("loading");
        const body = await requestJson("/replay/api/events", paramsFromForm({ mode: "events" }));
        state.events = body.events || [];
        clearReplayInspectorContext();
        renderResults();
        setStatus(`${state.events.length} events`, true);
        renderEventContext();
      }

      async function loadFunnels() {
        setStatus("loading");
        const body = await requestJson("/replay/api/funnels", paramsFromForm({ mode: "funnels" }));
        state.funnels = body.sessions || [];
        clearReplayInspectorContext();
        renderResults();
        setStatus(`${state.funnels.length} funnel sessions`, true);
        renderFunnelContext(body);
      }

      async function loadFriction() {
        setStatus("loading");
        const body = await requestJson("/replay/api/friction", paramsFromForm({ mode: "friction" }));
        state.friction = body.sessions || [];
        clearReplayInspectorContext();
        renderResults();
        setStatus(`${state.friction.length} flagged sessions`, true);
        renderFrictionContext();
      }

      async function loadPerson() {
        setStatus("loading");
        const body = await requestJson("/replay/api/person", paramsFromForm({ mode: "person" }));
        state.person = body;
        clearReplayInspectorContext();
        renderResults();
        setStatus(`${(body.timeline || []).length} journey items`, true);
        renderPersonContext();
      }

      async function loadSession(sessionId, atMs = 0) {
        setStatus("loading");
        const params = paramsFromForm({ mode: "sessionLoad" });
        params.delete("session_id");
        if (Number.isFinite(atMs) && atMs > 0) params.set("at_ms", String(Math.round(atMs)));
        const body = await requestJson(`/replay/api/sessions/${encodeURIComponent(sessionId)}`, params);
        state.selectedSession = body.session;
        state.sessionPayload = body;
        renderResults();
        renderFacts(body.session);
        renderActivity(body.activity || []);
        renderPlayer(body.events || [], body.replay_anchor_ms || atMs || 0);
        writeDeepLink(body.session.session_id, body.replay_anchor_ms || atMs || 0);
        setStatus("ready", true);
      }

      async function selectEvent(event) {
        state.selectedEvent = event;
        setField("distinct_id", event.distinct_id);
        setField("session_id", event.session_id);
        renderResults();
        renderEventContext();
        await loadSessions({ silent: true, keepSelection: true });
        const match = state.sessions.find((session) => session.session_id === event.session_id) || state.sessions[0];
        if (!match) {
          showMessage("empty", "No recording", "No replay session matched this event.");
          return;
        }
        await loadSession(match.session_id, anchorForEvent(event, match));
      }

      async function selectFunnel(session) {
        state.selectedFunnel = session;
        state.selectedEvent = null;
        renderResults();
        renderFunnelContext({ sessions: [session], steps: session.steps?.map((step) => step.event) || [] });
        await openReplayForAnalytics(
          session.session_id,
          session.distinct_id,
          session.steps?.at(-1)?.created_at,
        );
      }

      async function selectFriction(item) {
        state.selectedFriction = item;
        renderResults();
        renderFrictionContext(item);
        const signal = item.signals[0];
        setField("distinct_id", item.session.distinct_id);
        setField("session_id", item.session.session_id);
        await loadSession(item.session.session_id, signal?.replay_anchor_ms || 0);
      }

      async function selectPersonItem(item) {
        state.selectedPersonItem = item;
        renderResults();
        renderPersonContext(item);
        if (item.kind === "session" && item.session_id) {
          setField("session_id", item.session_id);
          await loadSession(item.session_id, 0);
          return;
        }
        await openReplayForAnalytics(item.session_id, null, item.timestamp);
      }

      async function openReplayForAnalytics(sessionId, distinctId, createdAt) {
        if (!sessionId) {
          showMessage("empty", "No recording", "This item does not have a replay session id.");
          return;
        }
        if (distinctId) setField("distinct_id", distinctId);
        setField("session_id", sessionId);
        await loadSessions({ silent: true, keepSelection: true });
