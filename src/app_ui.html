<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hogflare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/rrweb-player@latest/dist/index.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f8;
        --surface: #ffffff;
        --surface-soft: #eef1f4;
        --ink: #0b0d10;
        --muted: #5c6670;
        --faint: #7b8490;
        --line: #dbe1e7;
        --line-strong: #b9c2cc;
        --accent: #087a55;
        --accent-soft: #e3f4eb;
        --danger: #9d332b;
        --mono:
          "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
      }

      body {
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1.35;
        text-rendering: geometricPrecision;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .app {
        display: grid;
        --rail-track: minmax(320px, 380px);
        --inspector-track: minmax(330px, 420px);
        grid-template-columns: var(--rail-track) minmax(560px, 1fr) var(--inspector-track);
        height: 100vh;
        min-height: 0;
      }

      .app.rail-collapsed {
        --rail-track: 0px;
      }

      .app.inspector-collapsed {
        --inspector-track: 0px;
      }

      .rail,
      .stage,
      .inspector {
        min-height: 0;
        min-width: 0;
        background: var(--surface);
      }

      .rail {
        position: relative;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        border-right: 1px solid var(--line);
      }

      .rail-content {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 0;
      }

      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr);
        border-right: 1px solid var(--line);
      }

      .app.inspector-collapsed .stage {
        border-right: 0;
      }

      .inspector {
        position: relative;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
      }

      .inspector-content {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        min-height: 0;
      }

      .app.rail-collapsed .rail-content,
      .app.inspector-collapsed .inspector-content {
        display: none;
      }

      .app.rail-collapsed .rail,
      .app.inspector-collapsed .inspector {
        border: 0;
        background: transparent;
        pointer-events: none;
        z-index: 20;
      }

      .topbar,
      .stage-head,
      .inspector-head {
        height: 56px;
        border-bottom: 1px solid var(--line);
        padding: 8px 16px;
      }

      .inspector-head {
        display: flex;
        align-items: center;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        justify-content: space-between;
      }

      .topbar-primary {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 12px;
      }

      .brand-mark {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 40px;
        color: var(--ink);
      }

      .brand-mark svg {
        display: block;
        width: 34px;
        height: 40px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 15px;
        font-weight: 720;
        letter-spacing: 0;
      }

      h2 {
        font-size: 14px;
        font-weight: 720;
      }

      .eyebrow,
      .label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 680;
        letter-spacing: 0;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .status::before {
        display: block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--line-strong);
        content: "";
      }

      .status.is-ok::before {
        background: var(--accent);
      }

      .status.is-loading::before {
        width: 8px;
        height: 8px;
        border: 2px solid var(--line-strong);
        border-top-color: var(--accent);
        background: transparent;
        animation: spin 700ms linear infinite;
      }

      .status[hidden] {
        display: none !important;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .section-switch {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 2px;
      }

      .section-button {
        height: 28px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        padding: 0 10px;
        font-size: 12px;
        font-weight: 720;
        white-space: nowrap;
      }

      .section-button[aria-selected="true"] {
        background: var(--ink);
        color: var(--surface);
      }

      .mode-switch {
        display: flex;
        gap: 5px;
        overflow-x: auto;
        background: transparent;
      }

      .mode-button {
        height: 28px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--muted);
        padding: 0 9px;
        font-size: 11px;
        font-weight: 680;
        white-space: nowrap;
      }

      .mode-button[aria-selected="true"] {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--surface);
      }

      .filters {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        padding: 12px;
      }

      .rail-body {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        min-height: 0;
      }

      .result-controls {
        display: grid;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
      }

      .mode-options {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .mode-panel {
        display: grid;
        gap: 8px;
      }

      .section-controls {
        display: grid;
        grid-column: 1 / -1;
        gap: 10px;
      }

      .analytics-query-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
      }

      .semantic-filter-block {
        display: grid;
        gap: 6px;
      }

      .semantic-filter-strip {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
      }

      .semantic-filter-pill {
        display: inline-flex;
        align-items: center;
        max-width: 100%;
        gap: 5px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--muted);
        font-size: 11px;
        line-height: 1;
        padding: 5px 6px 5px 8px;
      }

      .semantic-filter-pill span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .semantic-filter-pill button {
        display: grid;
        place-items: center;
        width: 16px;
        height: 16px;
        border: 0;
        border-radius: 999px;
        background: var(--surface-soft);
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        padding: 0;
      }

      .select-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }

      .select-field {
        display: grid;
        min-width: 0;
        gap: 5px;
      }

      .select-field select {
        width: 100%;
        height: 32px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--ink);
        padding: 0 8px;
        outline: none;
        font-size: 12px;
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip-button {
        height: 28px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--muted);
        padding: 0 9px;
        font-size: 11px;
        font-weight: 680;
      }

      .chip-button.is-selected {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--ink);
      }

      .date-range {
        display: grid;
        grid-column: 1 / -1;
        min-inline-size: 0;
        min-width: 0;
        gap: 8px;
        margin: 0;
        padding: 0;
      }

      .date-range-label {
        display: block;
      }

      .date-inputs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .date-field {
        display: grid;
        min-width: 0;
        gap: 5px;
      }

      .date-field span {
        color: var(--muted);
        font-size: 11px;
        font-weight: 680;
      }

      .date-presets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .preset-button {
        height: 26px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--muted);
        padding: 0 8px;
        font-size: 11px;
        font-weight: 680;
      }

      .preset-button.is-selected {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--ink);
      }

      .field {
        display: grid;
        min-width: 0;
        gap: 5px;
      }

      .field.wide {
        grid-column: 1 / -1;
      }

      .field input,
      .field select,
      .date-field input {
        width: 100%;
        height: 34px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--ink);
        padding: 0 9px;
        outline: none;
        font-size: 12px;
      }

      .field select {
        cursor: pointer;
      }

      .date-field input {
        padding-right: 6px;
      }

      .date-field input::-webkit-calendar-picker-indicator {
        cursor: pointer;
        opacity: 0.7;
      }

      .field input:focus,
      .field select:focus,
      .date-field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }

      .actions {
        display: flex;
        grid-column: 1 / -1;
        gap: 8px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        height: 34px;
        border-radius: 5px;
        padding: 0 11px;
        background: var(--ink);
        color: var(--surface);
        font-size: 12px;
        font-weight: 720;
        white-space: nowrap;
      }

      .button.secondary {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
      }

      .button.subtle {
        height: 28px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        font-size: 11px;
      }

      .button:disabled,
      .preset-button:disabled,
      .mode-button:disabled,
      .section-button:disabled,
      .chip-button:disabled {
        cursor: wait;
        opacity: 0.56;
        transform: none !important;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .panel-dock {
        display: flex;
        align-items: center;
        min-height: 56px;
        border-top: 1px solid var(--line);
        background: var(--surface);
        padding: 12px;
      }

      .rail-dock {
        justify-content: flex-end;
      }

      .inspector-dock {
        justify-content: space-between;
        gap: 12px;
      }

      .panel-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: 1px solid rgba(185, 194, 204, 0.72);
        border-radius: 999px;
        background: var(--surface);
        color: var(--muted);
        box-shadow: 0 4px 14px rgba(16, 24, 40, 0.08);
        transition:
          border-color 140ms ease,
          color 140ms ease,
          transform 140ms ease,
          background 140ms ease;
      }

      .panel-toggle:focus-visible {
        border-color: var(--accent);
        box-shadow:
          0 0 0 2px var(--accent-soft),
          0 4px 14px rgba(16, 24, 40, 0.08);
        outline: none;
      }

      .panel-toggle svg {
        display: none;
        width: 17px;
        height: 17px;
        stroke-width: 2;
      }

      .panel-toggle[data-state="expanded"] .panel-icon-expanded,
      .panel-toggle[data-state="collapsed"] .panel-icon-collapsed {
        display: block;
      }

      .app.rail-collapsed .rail-dock,
      .app.inspector-collapsed .inspector-dock {
        position: fixed;
        top: auto;
        right: auto;
        bottom: 12px;
        align-items: flex-end;
        justify-content: center;
        min-height: 0;
        border-top: 0;
        background: transparent;
        padding: 0;
        pointer-events: auto;
      }

      .app.rail-collapsed .rail-dock {
        left: 12px;
      }

      .app.inspector-collapsed .inspector-dock {
        right: 12px;
      }

      .app.inspector-collapsed #debugToggle {
        display: none;
      }

      @media (hover: hover) {
        .button:hover {
          background: #2a2d2a;
        }

        .button.secondary:hover,
        .button.subtle:hover,
        .preset-button:hover,
        .row-button:hover,
        .timeline-row:hover,
        .panel-toggle:hover {
          background: var(--surface-soft);
          border-color: var(--line-strong);
          color: var(--ink);
          transform: translateY(-1px);
        }
      }

      .results-pane {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 0;
      }

      .results-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
      }

      .count {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
      }

      .result-list {
        min-height: 0;
        overflow: auto;
      }

      .row-button {
        display: grid;
        width: 100%;
        gap: 6px;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        padding: 11px 12px;
        text-align: left;
      }

      .row-button.is-selected {
        background: var(--accent-soft);
        box-shadow: inset 3px 0 0 var(--accent);
      }

      .timeline-row.is-selected {
        background: var(--accent-soft);
        box-shadow: inset 3px 0 0 var(--accent);
      }

      .row-title {
        overflow: hidden;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 720;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 5px 9px;
        color: var(--muted);
        font-size: 11px;
      }

      .stage-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .stage-title {
        min-width: 0;
      }

      .stage-title strong {
        display: block;
        overflow: hidden;
        font-family: var(--mono);
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stage-title span {
        display: block;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .player-wrap {
        min-height: 0;
        min-width: 0;
        width: 100%;
        max-width: 100%;
        overflow: auto;
      }

      #player {
        position: relative;
        min-height: 0;
        min-width: 0;
        width: 100%;
        max-width: 100%;
      }

      #player .rr-player {
        background: var(--surface) !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
      }

      #player .rr-player__frame,
      #player .replayer-wrapper {
        border-radius: 0 !important;
        box-shadow: none !important;
      }

      .empty,
      .error {
        display: grid;
        place-content: center;
        min-height: 320px;
        gap: 8px;
        color: var(--muted);
        text-align: center;
      }

      .empty strong,
      .error strong {
        color: var(--ink);
        font-size: 14px;
      }

      .error strong {
        color: var(--danger);
      }

      .chart-overview {
        display: grid;
        grid-template-rows: auto minmax(286px, 0.85fr) auto;
        gap: 0;
        min-height: 100%;
        max-width: 100%;
        overflow: auto;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        border-bottom: 1px solid var(--line);
      }

      .metric-card {
        display: grid;
        gap: 2px;
        min-width: 0;
        min-height: 58px;
        appearance: none;
        border: 0;
        border-right: 1px solid var(--line);
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        padding: 9px 12px;
        text-align: left;
      }

      .metric-card.is-skeleton {
        cursor: default;
        pointer-events: none;
      }

      .metric-card:last-child {
        border-right: 0;
      }

      .metric-card:hover,
      .metric-card.is-selected {
        background: var(--surface-soft);
      }

      .metric-card.is-selected {
        box-shadow: inset 0 -2px 0 var(--accent);
      }

      .metric-card:focus-visible,
      .breakdown-row:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .metric-card span,
      .chart-meta,
      .chart-legend {
        color: var(--muted);
        font-size: 11px;
      }

      .metric-card strong {
        overflow: hidden;
        font-family: var(--mono);
        font-size: 16px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .metric-card code,
      .chart-meta code {
        display: block;
        overflow: hidden;
        max-width: 100%;
        color: var(--faint);
        font-family: var(--mono);
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chart-panel {
        display: grid;
        position: relative;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 0;
        min-width: 0;
        overflow: hidden;
        border-bottom: 1px solid var(--line);
      }

      .chart-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: nowrap;
        gap: 12px;
        padding: 9px 12px 4px;
      }

      .chart-panel-head .label {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chart-panel-head .chart-meta {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-align: right;
      }

      .chart-panel-head .chart-legend {
        flex: 0 1 auto;
        justify-content: flex-end;
        min-width: 0;
      }

      .chart-canvas {
        position: relative;
        min-height: 230px;
        padding: 2px 12px 10px;
      }

      .chart-svg {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 220px;
      }

      .chart-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 7px 12px;
      }

      .legend-key {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .legend-swatch {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--accent);
      }

      .breakdown-grid {
        display: grid;
        grid-auto-flow: dense;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }

      .breakdown-list {
        display: grid;
        align-content: start;
        gap: 0;
        padding: 4px 0 12px;
      }

      .skeleton-line,
      .skeleton-row::before,
      .skeleton-row::after {
        display: block;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--surface-soft), #f8fafb, var(--surface-soft));
        background-size: 220% 100%;
        animation: skeleton-pulse 1.1s ease-in-out infinite;
        content: "";
      }

      .skeleton-line {
        height: 10px;
      }

      .skeleton-line.short {
        width: 44%;
      }

      .skeleton-line.medium {
        width: 68%;
      }

      .skeleton-line.long {
        width: 86%;
      }

      .skeleton-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 42px;
        gap: 12px;
        align-items: center;
        min-height: 28px;
        padding: 6px 12px;
      }

      .skeleton-row::before {
        width: var(--skeleton-width, 74%);
        height: 11px;
      }

      .skeleton-row::after {
        width: 34px;
        height: 11px;
        justify-self: end;
      }

      @keyframes skeleton-pulse {
        to {
          background-position: -220% 0;
        }
      }

      .breakdown-grid .chart-panel {
        border-top: 1px solid var(--line);
        border-bottom: 0;
        background: var(--surface);
      }

      .breakdown-grid .chart-panel:first-child {
        grid-column: span 2;
      }

        border-left: 1px solid var(--line);
      }

      .breakdown-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        position: relative;
        width: 100%;
        appearance: none;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        overflow: hidden;
        padding: 4px 12px;
        text-align: left;
      }

      .breakdown-row:hover {
        background: #eef2ff;
      }

        background: rgb(15 23 42 / 8%);
      }

      .breakdown-row.is-other {
        cursor: default;
        color: var(--muted);
      }

      .breakdown-row.is-other:hover {
        background: transparent;
      }

      .breakdown-row::before {
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--bar-width, 0%);
        background: rgba(107, 124, 255, 0.12);
        content: "";
      }

        position: relative;
        z-index: 1;
        overflow: hidden;
        min-width: 0;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;

        grid-template-columns: 1fr 1fr;
        border-bottom: 1px solid var(--line);
      }

        display: grid;
        gap: 3px;
        min-width: 0;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
      }

        border-right: 0;
      }

      .fact:nth-last-child(-n + 2) {
        border-bottom: 0;
      }

      .fact span {
        color: var(--muted);
        font-size: 11px;
        font-weight: 680;
      }

      .fact strong {
        overflow: hidden;
        font-family: var(--mono);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;

        align-items: center;

        overflow: auto;

      .timeline-row {

        grid-template-columns: 58px minmax(0, 1fr);
        gap: 10px;
        width: 100%;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        padding: 9px 12px;
        text-align: left;
      }

      .context-row {
        grid-template-columns: 78px minmax(0, 1fr);
        cursor: default;
      }

      @media (hover: hover) {
        .context-row:hover {
          background: transparent;
          border-color: var(--line);
          color: var(--ink);
          transform: none;
        }
      }

      .timeline-time {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .timeline-main {
        min-width: 0;
      }

      .timeline-main strong,
      .timeline-main span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .timeline-main strong {
        font-size: 12px;
      }

      .timeline-main span {
        color: var(--muted);
        font-size: 11px;
      }

      .debug {

      }

      .debug.is-open {

      }

      .debug pre {
        max-height: 220px;

    </style>

      const state = {
        mode: "overview",
        section: "analytics",
        lastReplayMode: "sessions",
        charts: null,

        events: [],

        friction: [],

        selectedEvent: null,

        selectedPersonItem: null,
        sessionPayload: null,
        player: null,

        inspectorCollapsed: false,
      };

      const playerControllerHeight = 80;

      const modes = {
        overview: { label: "Product analytics" },
        sessions: { label: "Recent sessions" },
        events: { label: "Events" },
